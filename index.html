     <button class="btn p" style="width:100%;justify-content:center;padding:11px" type="submit">${signup?'Create account':'Sign in'}</button></form>
    ${smode==='closed'?'<p class="sm c mut" style="margin-top:12px">Accounts are created by your administrator.</p>':`<p class="sm c" style="margin-top:12px">${signup?'Already have an account?':'New here?'} <button class="link" data-act="loginmode">${signup?'Sign in':'Create an account'}</button></p>`}
    ${demo?`<hr style="margin:18px 0"><p class="sm b" style="margin-bottom:8px">Try the demo with sample data</p><div class="row"><button class="btn" data-act="demologin" data-e="admin@demo.app" data-p="admin123">${ic('shield',15)} Demo Admin</button><button class="btn" data-act="demologin" data-e="user@demo.app" data-p="user123">${ic('user',15)} Demo User</button></div><p class="help" style="margin-top:6px">Admin sees user management, master data and the audit trail. User sees personal modules only.</p>`:''}
    ${demo||/[?&#]setup\b/.test(location.search+location.hash)?`<p class="sm c" style="margin-top:18px"><button class="link" data-act="connmodal">${ic('cog',14)} Database settings</button></p>`:''}</div></div></div>`;
  if(window.innerWidth<860){const l=$('.login');l.style.gridTemplateColumns='1fr';$('.login .l').style.padding='24px 20px'}
}
ACT.loginmode=()=>{S.loginMode=S.loginMode==='in'?'up':'in';showLogin()};
ACT.dologin=async()=>{const f=$('#lform').elements,email=f.email.value.trim(),pw=f.password.value;if(!email||pw.length<6)return showLogin('Enter your email and a password of at least 6 characters.');
  try{if(S.loginMode==='up'){const r=await DB.signUp(email,pw,(f.name&&f.name.value.trim())||'');if(r==='confirm'){S.loginMode='in';return showLogin('Account created. Check your email to confirm it, then sign in.',true)}}else await DB.signIn(email,pw);await startApp()}
  catch(e){console.warn(e);showLogin(e.message||'Could not sign in')}};
ACT.demologin=async el=>{try{await DB.signIn(el.dataset.e,el.dataset.p);await startApp()}catch(e){showLogin(e.message)}};
ACT.connmodal=()=>{const c=getCfg();openModal('Database settings',`<p class="sm ink2" style="margin-bottom:12px">Paste your Supabase project values to store data in your own SQL database. Leave empty to stay in demo mode. The SQL schema is available after you sign in (Settings → Database).</p><form id="cform" onsubmit="return false"><div class="fgrid"><div class="fld wide"><label>Supabase project URL</label><input class="in" name="url" placeholder="https://xxxxxxxx.supabase.co" value="${esc(c.url||'')}"><p class="help">Project Settings → API → Project URL.</p></div><div class="fld wide"><label>Anon public key</label><input class="in" name="key" value="${esc(c.key||'')}"><p class="help">The public “anon” key, never the service_role key.</p></div></div></form>`,`${c.url?`<button class="btn" data-act="democfg">Use demo mode</button>`:''}<button class="btn" data-act="closeModal">Cancel</button><button class="btn p" data-act="savecfg">Save and reload</button>`)};

/* =====================================================================
   BOOT
   ===================================================================== */
function showFatal(e){console.error(e);const m=String(e&&e.message||e);
  $('#root').innerHTML=`<div class="login" style="display:grid;place-items:center;padding:20px"><div class="card" style="max-width:520px"><h2 style="font:700 22px var(--serif);margin-bottom:8px">The database is not ready</h2><p class="ink2">${esc(m)}</p><p class="sm ink2" style="margin:10px 0">If this is a new Supabase project, open <b>SQL Editor</b>, paste the schema (Settings → Database in demo mode, or the <b>schema.sql</b> file) and run it once. Then reload.</p><div class="row"><button class="btn p" onclick="location.reload()">Reload</button><button class="btn" data-act="democfg">Switch to demo mode</button><button class="btn" data-act="logout">Sign out</button></div></div></div>`}
function showPending(){
  document.body.classList.remove('nav');$('#layer').innerHTML='';
  $('#root').innerHTML=`<main class="login" style="display:grid;place-items:center;padding:20px"><div class="card" style="max-width:520px"><div class="brand" style="padding:0;margin-bottom:10px">${LOGO}<div><b style="font-size:22px">${APP_NAME}</b></div></div><h1 style="font:700 24px var(--serif);margin-bottom:8px">Waiting for approval</h1><p class="ink2">Your account <b>${esc(S.profile.email||'')}</b> was created, but an admin has to approve it before you can use ${APP_NAME}. Sign in again later, or press the button to check now.</p><div class="row" style="margin-top:14px"><button class="btn p" data-act="pendingcheck">${ic('refresh',15)} Check again</button><button class="btn" data-act="logout">Sign out</button></div></div></main>`}
ACT.pendingcheck=async()=>{try{await startApp()}catch(e){showFatal(e)}};
async function startApp(){
  S.loginMode='in';
  S.profile=await DB.getProfile();
  const pst=typeof profStatus==='function'?profStatus(S.profile):'active';
  if(pst==='disabled'){await DB.signOut();return showLogin('This account is switched off. Ask an admin.')}
  if(pst==='pending')return showPending();
  try{await DB.loadAll()}catch(e){return showFatal(e)}
  if(DB.mode==='demo'&&['admin@demo.app','user@demo.app'].includes(S.profile.email)&&!S.profile.seeded&&!(D().activities||[]).length&&!(D().portfolios||[]).length){try{await seedSample();await DB.saveProfile({seeded:true});S.profile.seeded=true}catch(e){console.error(e)}}
  try{await ensureBuiltinConnections()}catch(e){console.warn(e)}
  mountShell();S.route={p:'dashboard',s:'overview'};parseHash();render();
  if(typeof refreshAccessInfo==='function')refreshAccessInfo();
  clearInterval(S.syncTimer);setTimeout(()=>{runAutoSync('open');runAutomations();drainInbox();S.syncTimer=setInterval(()=>{runAutoSync('tick');runAutomations();if(typeof refreshAccessInfo==='function')refreshAccessInfo()},300000)},1500);
  if(S.profile._missing)toast('Profile row not found — run the SQL schema in Supabase.',1);
}
(async function boot(){
  try{await DB.init()}catch(e){console.error(e)}
  try{S.signupMode=await DB.publicSignupMode()}catch(e){S.signupMode='open'}
  if(DB.user)startApp().catch(showFatal);else showLogin();
})();
</script>
</body>
</html>
