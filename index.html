<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tuntas — Plan, do, prove, improve</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230E7C66'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='%23fff' stroke-opacity='.3' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='%23fff' stroke-width='5' stroke-linecap='round' stroke-dasharray='80 27' transform='rotate(-90 32 32)'/%3E%3Cpath d='M24.5 32.5l5.5 5.5 10-11' fill='none' stroke='%23FFD27A' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0F1B2D;--ink2:#46536A;--mut:#8592A6;--line:#E6EAF0;--soft:#F6F8FA;--brand:#0E7C66;--brand2:#0A5C4C;--brandsoft:#E7F5F1;
--blue:#2F6FDE;--bluesoft:#EAF1FD;--red:#D64545;--redsoft:#FCEBEB;--amber:#C97F00;--ambersoft:#FFF3DC;--orange:#E4631A;--orangesoft:#FDEBDD;
--green:#1F9D55;--greensoft:#E5F6EC;--violet:#7C5CD6;--violetsoft:#EFEBFB;--slate:#64748B;--slatesoft:#EEF1F5;--r:12px;
--sh:0 1px 2px rgba(15,27,45,.05),0 6px 18px rgba(15,27,45,.04);--ui:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--serif:'Bricolage Grotesque','Plus Jakarta Sans',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font:14px/1.5 var(--ui);-webkit-text-size-adjust:100%}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
p{margin:0}
a{color:var(--brand);text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.serif{font-family:var(--serif)}
.mono{font-family:var(--mono);font-size:12px}
.mut{color:var(--mut)}.ink2{color:var(--ink2)}
.sm{font-size:12px}.xs{font-size:11px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sp{flex:1}
.hide{display:none!important}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}

/* shell */
.app{display:flex;min-height:100vh}
.side{width:244px;flex:none;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;padding:16px 12px;background:#fff;display:flex;flex-direction:column;z-index:40}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand svg{width:38px;height:38px;flex:none}
.brand b{font:700 22px var(--serif);letter-spacing:-.02em;line-height:1}
.brand small{display:block;color:var(--mut);font-size:11px;margin-top:3px}
.np{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:none;border-radius:10px;color:var(--ink2);font-weight:600;text-align:left}
.np:hover{background:var(--soft)}
.np.on{background:var(--brandsoft);color:var(--brand2)}
.np .n{margin-left:auto;font-size:11px;background:var(--red);color:#fff;border-radius:9px;padding:0 6px}
.sidefoot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line)}
.me{display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:50%;background:var(--brandsoft);color:var(--brand2);display:grid;place-items:center;font-weight:700;flex:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);display:flex;align-items:center;gap:10px;padding:10px 20px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.top h1{font:700 22px var(--serif);letter-spacing:-.02em}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;position:relative}
.iconbtn:hover{background:var(--soft)}
.iconbtn .dot{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-size:10px;border-radius:9px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 4px}
.subtabs{display:flex;gap:2px;overflow-x:auto;padding:0 20px;border-bottom:1px solid var(--line);position:sticky;top:60px;z-index:25;background:#fff;scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{border:0;background:none;padding:10px 14px;color:var(--ink2);font-weight:600;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.subtabs button:hover{color:var(--ink)}
.subtabs button.on{color:var(--brand2);border-color:var(--brand)}
.page{padding:22px 20px 90px;width:100%;max-width:1320px;margin:0 auto}
.ph{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ph h2{font:700 24px var(--serif);letter-spacing:-.02em}
.ph p{color:var(--ink2);margin-top:2px;max-width:70ch}
.scrim{display:none}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;border:0;background:var(--brand);color:#fff;box-shadow:0 8px 24px rgba(14,124,102,.4);display:grid;place-items:center;z-index:35}
.fab svg{width:24px;height:24px}

/* components */
.card{border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:16px;box-shadow:var(--sh)}
.card.flat{box-shadow:none}
.card>h3,.ch h3{font-size:15px}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.g{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.g12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.stat{padding:14px;border:1px solid var(--line);border-radius:var(--r);background:#fff}
.stat .l{color:var(--ink2);font-size:12px;font-weight:600}
.stat .v{font:700 28px var(--serif);letter-spacing:-.02em;margin-top:2px;line-height:1.15}
.stat .s{color:var(--mut);font-size:12px}
.stat.red .v{color:var(--red)}.stat.green .v{color:var(--green)}.stat.blue .v{color:var(--blue)}.stat.amber .v{color:var(--amber)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--slatesoft);color:var(--slate)}
.b-green{background:var(--greensoft);color:#157A40}.b-blue{background:var(--bluesoft);color:#2457B5}.b-amber{background:var(--ambersoft);color:#9A6200}
.b-orange{background:var(--orangesoft);color:#B64A0E}.b-red{background:var(--redsoft);color:#B02F2F}.b-violet{background:var(--violetsoft);color:#5B3FB0}.b-brand{background:var(--brandsoft);color:var(--brand2)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font-weight:600;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}.btn.p:hover{background:var(--brand2)}
.btn.d{color:var(--red);border-color:#F2C9C9}.btn.d:hover{background:var(--redsoft)}
.btn.s{padding:4px 10px;font-size:12px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.link{border:0;background:none;color:var(--brand);font-weight:600;padding:0;cursor:pointer}
.link:hover{text-decoration:underline}
.in{width:100%;padding:9px 11px;border:1px solid #D5DBE4;border-radius:10px;background:#fff;color:var(--ink);font:inherit;min-height:40px}
.in:focus{outline:2px solid #BFE3DA;border-color:var(--brand)}
textarea.in{resize:vertical;line-height:1.45}
select.in{appearance:auto}
input[type=range]{width:100%;accent-color:var(--brand)}
input[type=color]{padding:2px;height:40px}
.chk{display:flex;align-items:center;gap:8px;font-weight:500}
.chk input{width:18px;height:18px;accent-color:var(--brand)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.fld{min-width:0}.fld.wide{grid-column:1/-1}
.fld>label{display:block;font-weight:700;margin-bottom:4px;font-size:13px}
.req{color:var(--red);margin-left:2px}
.help{color:var(--mut);font-size:12px;margin-top:4px;line-height:1.4}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;color:var(--ink2);font-weight:700;padding:10px 12px;background:var(--soft);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr[data-act]{cursor:pointer}
.tbl tbody tr[data-act]:hover{background:#FAFCFD}
.pbar{height:7px;border-radius:9px;background:var(--slatesoft);overflow:hidden;min-width:60px}
.pbar i{display:block;height:100%;background:var(--brand);border-radius:9px}
.pcell{display:flex;align-items:center;gap:8px;min-width:100px}.pcell span{font-size:12px;font-weight:600;min-width:34px;text-align:right}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .in{width:auto;min-width:130px}
.toolbar .search{flex:1;min-width:180px;max-width:360px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font-weight:600;color:var(--ink2)}
.pill.on{background:var(--ink);border-color:var(--ink);color:#fff}
.callout{display:flex;gap:10px;align-items:flex-start;background:var(--brandsoft);border-radius:var(--r);padding:12px 14px;margin-bottom:16px;color:#124B3F}
.callout svg{margin-top:2px;color:var(--brand)}
.callout.warn{background:var(--ambersoft);color:#6B4400}.callout.warn svg{color:var(--amber)}
.empty{text-align:center;padding:36px 16px;color:var(--ink2)}
.empty b{display:block;font:700 18px var(--serif);color:var(--ink);margin-bottom:4px}
.empty .btn{margin-top:12px}
.empty-mini{color:var(--mut);padding:18px;text-align:center}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px}
.kv dt{color:var(--ink2);font-weight:600;font-size:12px;padding-top:2px}.kv dd{margin:0;white-space:pre-wrap;word-break:break-word}
.list>*{padding:10px 0;border-bottom:1px solid var(--line)}.list>*:last-child{border-bottom:0}
.item{display:flex;gap:10px;align-items:center;cursor:pointer}
.item:hover .t{color:var(--brand2)}
.item .t{font-weight:600}
/* modal */
.mback{position:fixed;inset:0;background:rgba(15,27,45,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:16px;width:100%;max-width:760px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(15,27,45,.3)}
.modal.wide{max-width:1000px}.modal.sm2{max-width:440px}
.mh{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.mh h3{font:700 19px var(--serif);flex:1;min-width:0}
.mb{padding:18px 20px;overflow:auto}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--line);flex-wrap:wrap;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:92vw}
.toast.err{background:var(--red)}
.pop{position:absolute;right:0;top:46px;width:340px;max-width:92vw;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 44px rgba(15,27,45,.2);z-index:60;max-height:70vh;overflow:auto}
.pop .it{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:10px}
.pop .it:hover{background:var(--soft)}
/* charts */
.chart{width:100%;height:auto;display:block}
.legend{display:flex;flex-direction:column;gap:5px;font-size:12px;min-width:140px}
.legend div{display:flex;align-items:center;gap:7px}.legend i{width:10px;height:10px;border-radius:3px;flex:none}.legend b{margin-left:auto;padding-left:10px}
.dn{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center}
.hb{display:grid;grid-template-columns:minmax(80px,150px) 1fr 52px;gap:8px;align-items:center;margin:7px 0;font-size:12px}
.hb .tr{height:10px;background:var(--slatesoft);border-radius:9px;overflow:hidden}.hb .tr i{display:block;height:100%;border-radius:9px}
.hb span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hb b{text-align:right}
.gantt{position:relative;font-size:12px}
.gr{display:grid;grid-template-columns:minmax(110px,200px) 1fr;gap:10px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--line)}
.gr .gl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;font-weight:600}
.gt{position:relative;height:20px;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(14.2857% - 1px),var(--line) calc(14.2857% - 1px),var(--line) 14.2857%)}
.gb{position:absolute;top:3px;height:14px;border-radius:7px;min-width:6px;overflow:hidden;opacity:.95;cursor:pointer}
.gb i{display:block;height:100%;background:rgba(255,255,255,.4)}
.gtoday{position:absolute;top:0;bottom:0;width:2px;background:var(--red);z-index:2}
.gax{display:grid;grid-template-columns:minmax(110px,200px) 1fr;gap:10px;color:var(--mut);font-size:11px}
.gax div+div{display:flex;justify-content:space-between}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dh{font-weight:700;font-size:12px;color:var(--ink2);text-align:center;padding:4px 0}
.cd{min-height:78px;border:1px solid var(--line);border-radius:10px;padding:5px 6px;cursor:pointer;background:#fff;text-align:left;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.cd:hover{background:var(--soft)}.cd.out{opacity:.4}.cd.sel{outline:2px solid var(--brand)}.cd.today b{background:var(--brand);color:#fff}
.cd b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px}
.cd .dots{display:flex;gap:3px;flex-wrap:wrap}.cd .dots i{width:7px;height:7px;border-radius:50%}
.cd .ev{font-size:10px;line-height:1.2;border-radius:4px;padding:1px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* matrices */
.hm{display:grid;grid-template-columns:28px repeat(5,1fr);gap:3px;font-size:12px}
.hm .c{min-height:48px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;cursor:pointer}
.hm .ax{display:grid;place-items:center;color:var(--ink2);font-size:11px}
.quad{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;display:flex;flex-direction:column;gap:8px;min-height:240px}
.quad h3{font:700 20px var(--serif)}
.q1{border-top:5px solid var(--red)}.q2{border-top:5px solid var(--blue)}.q3{border-top:5px solid var(--amber)}.q4{border-top:5px solid var(--slate)}
.qi{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:7px 9px;font-size:13px}
.qi .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;font-weight:600}
.tipcard{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;background:#fff}
.tipcard.on{border-color:var(--brand);background:#F5FBF9}
.tipcard .e{font-size:26px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flow .st{border:1.5px solid var(--brand);background:#F5FBF9;border-radius:10px;padding:6px 10px;font-weight:600}
.flow .ar{color:var(--mut)}
.tb{position:relative;border-left:1px solid var(--line);margin-left:44px}
.tbh{position:absolute;left:-44px;width:38px;text-align:right;font-size:11px;color:var(--mut);transform:translateY(-7px)}
.tbl-line{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.tbb{position:absolute;border-radius:8px;padding:3px 8px;font-size:12px;font-weight:600;overflow:hidden;color:#fff;cursor:pointer;border:1px solid rgba(255,255,255,.6)}
.hab{display:grid;grid-template-columns:minmax(150px,1.6fr) repeat(7,44px) 70px;gap:4px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.hab .cell{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line);background:#fff;display:grid;place-items:center;margin:auto;color:#fff}
.hab .cell.on{background:var(--brand);border-color:var(--brand)}.hab .cell.td{border-color:var(--brand)}
.hab .hd{text-align:center;font-size:11px;color:var(--ink2);font-weight:700}.hab .hd.td{color:var(--brand)}
.ring{display:inline-grid;place-items:center;position:relative}
.ring b{position:absolute;font-size:13px}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:#fff}
.lbox{width:100%;max-width:420px}
.lbox .brand{justify-content:center;padding-bottom:6px}.lbox .brand svg{width:64px;height:64px}.lbox .brand b{font-size:38px}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;border:1px solid rgba(0,0,0,.1)}
.pomo{font:700 44px var(--serif);text-align:center;letter-spacing:-.02em}
pre.sql{background:#0F1B2D;color:#D8E3F2;border-radius:12px;padding:14px;max-height:340px;overflow:auto;font:12px/1.5 var(--mono);white-space:pre}
.step{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.step .no{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.step:last-child{border-bottom:0}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--soft);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:140px}
.kc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer}
.tree .nd{margin-left:22px;border-left:2px solid var(--line);padding-left:12px}
.tree .tn{display:flex;gap:10px;align-items:center;padding:7px 0;cursor:pointer;flex-wrap:wrap}
.tree .tn:hover .t{color:var(--brand2)}.tree .t{font-weight:600}
.stk{display:flex;height:12px;border-radius:9px;overflow:hidden;background:var(--slatesoft)}
/* responsive */
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g6{grid-template-columns:repeat(3,minmax(0,1fr))}.g21,.g12{grid-template-columns:1fr}}
@media(max-width:900px){
 .side{position:fixed;left:0;top:0;bottom:0;transform:translateX(-102%);transition:transform .2s}
 body.nav .side{transform:none;box-shadow:0 0 40px rgba(0,0,0,.25)}
 body.nav .scrim{display:block;position:fixed;inset:0;background:rgba(15,27,45,.4);z-index:39}
 .g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:1fr}
 .menu{display:grid!important}
}
@media(min-width:901px){.menu{display:none!important}.fab{display:none}}
@media(max-width:720px){
 .top,.subtabs,.page{padding-left:14px;padding-right:14px}
 .top h1{font-size:19px}
 .g3,.g4,.g6{grid-template-columns:repeat(2,minmax(0,1fr))}
 .fgrid{grid-template-columns:1fr}
 .mback{align-items:flex-end;padding:0}.modal{max-width:none;border-radius:18px 18px 0 0;max-height:94vh}
 .kv{grid-template-columns:1fr}
 .stack thead{display:none}
 .stack,.stack tbody,.stack tr,.stack td{display:block;width:100%}
 .stack tr{padding:10px 12px;border-bottom:1px solid var(--line)}
 .stack td{border:0;padding:2px 0;display:flex;flex-wrap:wrap;gap:4px 8px;justify-content:space-between;align-items:center;text-align:right}

const pad=n=>String(n).padStart(2,'0');

/* ---------- small html helpers ---------- */
const TONE={'Completed':'green','Done':'green','Achieved':'green','Closed':'green','Standardized':'green','Verified':'green','Held':'green','Active':'green','Low':'slate',
'In Progress':'blue','Doing':'blue','Analysis':'blue','Mitigating':'blue','Checking':'blue','Medium':'blue','Action':'blue',
'On Hold':'amber','At Risk':'amber','Open':'amber','High':'orange','Critical':'red','Missed':'red','Expired':'red','Overdue':'red','Urgent':'orange','Highlight':'amber',
'Not Started':'slate','Planned':'slate','Cancelled':'slate','Draft':'slate','Retired':'slate','Idea':'violet'};
const badge=(v,t)=>v==null||v===''?'':`<span class="badge b-${t||TONE[v]||'slate'}">${esc(v)}</span>`;
const pbar=(p,c)=>{p=clamp(Math.round(num(p)),0,100);return `<div class="pcell"><div class="pbar" style="flex:1"><i style="width:${p}%;${c?`background:${c}`:''}"></i></div><span>${p}%</span></div>`};
const ring=(p,size=56,c='var(--brand)')=>{p=clamp(Math.round(num(p)),0,100);const r=size/2-5,C=2*Math.PI*r;return `<span class="ring ${size>=80?'lg':''}" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--slatesoft)" stroke-width="6"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${c}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C*p/100} ${C}" transform="rotate(-90 ${size/2} ${size/2})"/></svg><b>${p}%</b></span>`};
const stat=(l,v,s,t)=>`<div class="stat ${t||''}"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s||''}</div></div>`;

/* ---------- charts (inline SVG / CSS, no libraries) ---------- */
const PALETTE=['#0E7C66','#2F6FDE','#E4631A','#7C5CD6','#C97F00','#D64545','#1F9D55','#0B8FB5','#B5487E','#64748B'];
function pie(data,{size=170,donut=false,center=''}={}){
  data=data.filter(d=>d.value>0);const tot=sum(data.map(d=>d.value));
  if(!tot)return '<div class="empty-mini">No data yet</div>';
  const r=donut?size/2-14:size/4,sw=donut?26:size/2,C=2*Math.PI*r,cx=size/2;let off=0,segs='';
  data.forEach(d=>{const len=d.value/tot*C;segs+=`<circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${d.color}" stroke-width="${sw}" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cx})"/>`;off+=len});
  const mid=donut&&center?`<text x="${cx}" y="${cx+6}" text-anchor="middle" font-size="22" font-weight="700" font-family="Bricolage Grotesque,sans-serif" fill="#0F1B2D">${center}</text>`:'';
  return `<div class="dn"><svg viewBox="0 0 ${size} ${size}" style="width:${size}px;max-width:100%">${segs}${mid}</svg><div class="legend">${data.map(d=>`<div><i style="background:${d.color}"></i>${esc(d.label)}<b>${d.fmt||fmtN(d.value,1)} <span class="mut" style="font-weight:500">${Math.round(d.value/tot*100)}%</span></b></div>`).join('')}</div></div>`;
}
function nice(m){if(m<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(m))),n=m/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}
function bars(cats,series,{h=210,fmt=v=>fmtN(v,1)}={}){
  if(!cats.length)return '<div class="empty-mini">No data yet</div>';
  const W=Math.max(420,cats.length*64+50),pl=38,pb=34,pt=14,H=h,iw=W-pl-8,ih=H-pb-pt;
  const mx0=Math.max(1,...series.flatMap(s=>s.vals.map(num))),ints=series.every(s=>s.vals.every(v=>Number.isInteger(num(v))));let stp=nice(mx0/4);if(ints)stp=Math.max(1,stp);const max=stp*4;
  let g='';for(let i=0;i<=4;i++){const y=pt+ih-ih*i/4;g+=`<line x1="${pl}" x2="${W-8}" y1="${y}" y2="${y}" stroke="#E6EAF0"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="10" fill="#8592A6">${fmt(max*i/4)}</text>`}
  const bw=iw/cats.length,gw=Math.min(bw*.7,series.length*26),w1=gw/series.length;let b='';
  cats.forEach((c,i)=>{const x0=pl+bw*i+(bw-gw)/2;series.forEach((s,j)=>{const v=num(s.vals[i]),bh=ih*Math.max(v,0)/max;b+=`<rect x="${x0+j*w1}" y="${pt+ih-bh}" width="${w1-3}" height="${Math.max(bh,v>0?2:0)}" rx="3" fill="${s.color}"><title>${esc(s.name)}: ${fmt(v)}</title></rect>`});
    b+=`<text x="${pl+bw*i+bw/2}" y="${H-14}" text-anchor="middle" font-size="10.5" fill="#46536A">${esc(trunc(c,11))}</text>`});
  const lg=series.length>1?`<div class="row sm" style="justify-content:center;margin-top:4px">${series.map(s=>`<span><i class="sw" style="background:${s.color}"></i> ${esc(s.name)}</span>`).join('')}</div>`:'';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}${b}</svg>${lg}`;
}
function hbars(items,{max,suffix='%'}={}){
  if(!items.length)return '<div class="empty-mini">No data yet</div>';
  max=max||Math.max(100,...items.map(i=>i.value));
  return items.map(i=>`<div class="hb"><span title="${esc(i.label)}">${esc(i.label)}</span><div class="tr"><i style="width:${clamp(i.value/max*100,0,100)}%;background:${i.color||'var(--brand)'}"></i></div><b>${fmtN(i.value,0)}${suffix}</b></div>`).join('');
}
function lineChart(pts,{h=190,color='#0E7C66',fmt=v=>fmtN(v,0)}={}){
  if(pts.length<2)return '<div class="empty-mini">Add at least 2 entries to see a trend</div>';
  const W=560,H=h,pl=46,pb=26,pt=12,iw=W-pl-10,ih=H-pb-pt,ys=pts.map(p=>p.y),mn=Math.min(0,...ys),mx=Math.max(1,...ys),rg=(mx-mn)||1;
  const X=i=>pl+iw*i/(pts.length-1),Y=v=>pt+ih-ih*(v-mn)/rg;let g='';
  for(let i=0;i<=4;i++){const v=mn+rg*i/4,y=Y(v);g+=`<line x1="${pl}" x2="${W-10}" y1="${y}" y2="${y}" stroke="#E6EAF0"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="10" fill="#8592A6">${fmt(v)}</text>`}
  const path=pts.map((p,i)=>`${i?'L':'M'}${X(i)},${Y(p.y)}`).join(' ');
  const step=Math.ceil(pts.length/6);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}<path d="${path} L${X(pts.length-1)},${Y(0)} L${X(0)},${Y(0)}Z" fill="${color}" opacity=".08"/><path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>${pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.y)}" r="3.5" fill="#fff" stroke="${color}" stroke-width="2"><title>${esc(p.x)}: ${fmt(p.y)}</title></circle>${i%step===0?`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="#8592A6">${esc(p.x)}</text>`:''}`).join('')}</svg>`;
}
function paretoChart(items){
  items=items.filter(i=>num(i.v)>0).sort((a,b)=>b.v-a.v);const tot=sum(items.map(i=>i.v));
  if(!tot)return '<div class="empty-mini">Enter causes and counts to see the Pareto chart</div>';
  const W=Math.max(460,items.length*70+80),H=250,pl=40,pr=40,pt=14,pb=56,iw=W-pl-pr,ih=H-pt-pb,mx=items[0].v,bw=iw/items.length;let cum=0,b='',pts=[];
  items.forEach((it,i)=>{cum+=it.v;const bh=ih*it.v/mx,x=pl+bw*i;b+=`<rect x="${x+6}" y="${pt+ih-bh}" width="${bw-12}" height="${bh}" rx="3" fill="${cum-it.v<tot*.8?'#E4631A':'#9AA7B8'}"/><text x="${x+bw/2}" y="${pt+ih-bh-4}" text-anchor="middle" font-size="10" fill="#0F1B2D">${it.v}</text><text transform="translate(${x+bw/2},${H-pb+14}) rotate(28)" font-size="10.5" fill="#46536A">${esc(trunc(it.l,16))}</text>`;pts.push(`${x+bw/2},${pt+ih-ih*cum/tot}`)});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}"><line x1="${pl}" x2="${W-pr}" y1="${pt+ih*.2}" y2="${pt+ih*.2}" stroke="#2F6FDE" stroke-dasharray="4 4" opacity=".5"/>${b}<polyline points="${pts.join(' ')}" fill="none" stroke="#2F6FDE" stroke-width="2.5"/>${pts.map(p=>`<circle cx="${p.split(',')[0]}" cy="${p.split(',')[1]}" r="3.5" fill="#2F6FDE"/>`).join('')}<text x="${W-pr+4}" y="${pt+ih*.2+4}" font-size="10" fill="#2F6FDE">80%</text></svg><p class="sm mut">Orange bars = the vital few (about 80% of the total). Blue line = cumulative %.</p>`;
}
function gantt(items,from,to){
  const total=Math.max(1,diffD(to,from)),t=todayS();
  const pos=d=>clamp(diffD(d,from)/total*100,0,100);
  const ticks=[];for(let i=0;i<=6;i++)ticks.push(fmtS(addD(from,Math.round(total*i/6))));
  if(!items.length)return '<div class="empty-mini">No dated items in this window yet</div>';
  return `<div class="gantt"><div class="gax"><div></div><div>${ticks.map(x=>`<span>${x}</span>`).join('')}</div></div>${items.map(i=>{const l=pos(i.start),r=pos(addD(i.end,1)),w=Math.max(r-l,1.2);return `<div class="gr"><div class="gl" ${i.act}>${esc(i.label)}</div><div class="gt">${t>=from&&t<=to?`<div class="gtoday" style="left:${pos(t)}%"></div>`:''}<div class="gb" ${i.act} style="left:${l}%;width:${w}%;background:${i.color}" title="${esc(i.label)} · ${fmtS(i.start)} – ${fmtS(i.end)}"><i style="width:${clamp(num(i.pct),0,100)}%"></i></div></div></div>`}).join('')}</div>`;
}

/* emulate ON DELETE SET NULL / CASCADE on any {table:[rows]} object */
function cascade(tables,t,id){
  Object.keys(MOD).forEach(k=>{const m=MOD[k],rows=tables[m.t];if(!rows)return;
    m.fields.forEach(f=>{if(f.t==='ref'&&f.ref===t){
      if(f.cascade){tables[m.t]=tables[m.t].filter(r=>{const del=r[f.k]===id;if(del)cascade(tables,m.t,r.id);return !del})}
      else tables[m.t].forEach(r=>{if(r[f.k]===id)r[f.k]=null})}})});
}

const DB={
  mode:'demo',sb:null,user:null,
  async init(){
    const c=getCfg();this.mode='demo';
    if(c.url&&c.key&&!c.demo&&window.supabase){try{this.sb=window.supabase.createClient(c.url,c.key);this.mode='supabase'}catch(e){console.warn(e)}}

    else{Local.ensureDemo();const c2=Local.c(),u=c2.users.find(x=>x.id===c2.session);this.user=u&&u.active!==false?u:null}
  },
  async signIn(email,pw){
    if(this.mode==='supabase'){const {data,error}=await this.sb.auth.signInWithPassword({email,password:pw});if(error)throw error;this.user=data.user}
    else{const u=Local.c().users.find(x=>x.email.toLowerCase()===email.toLowerCase()&&x.password===pw);if(!u)throw new Error('Wrong email or password.');if(u.active===false)throw new Error('This account is deactivated. Ask an admin.');Local.c().session=u.id;Local.save();this.user=u}
  },
  async signUp(email,pw,name){
    if(this.mode==='supabase'){const {data,error}=await this.sb.auth.signUp({email,password:pw,options:{data:{full_name:name}}});if(error)throw error;if(!data.session)return 'confirm';this.user=data.user;return 'ok'}
    const c=Local.c();if(c.users.find(x=>x.email.toLowerCase()===email.toLowerCase()))throw new Error('This email is already registered.');
    const u=Local.mkUser({email,password:pw,full_name:name||email.split('@')[0],role:'user'});c.users.push(u);c.session=u.id;Local.save();this.user=u;return 'ok'
  },
  async signOut(){if(this.mode==='supabase')await this.sb.auth.signOut();else{Local.c().session=null;Local.save()}this.user=null},
  async getProfile(){
    if(this.mode==='supabase'){const {data}=await this.sb.from('profiles').select('*').eq('id',this.user.id).maybeSingle();
      return data||{id:this.user.id,email:this.user.email,full_name:(this.user.email||'').split('@')[0],role:'user',active:true,prefs:{},_missing:true}}
    const u=Local.c().users.find(x=>x.id===this.user.id);return clone(u)
  },
  async saveProfile(patch){
    if(this.mode==='supabase'){const {error}=await this.sb.from('profiles').update(patch).eq('id',this.user.id);if(error)throw error}
    else{const u=Local.c().users.find(x=>x.id===this.user.id);Object.assign(u,patch);Local.save();this.user=u}
  },
  async fetchAll(t,eq){let all=[],from=0;for(;;){let q=this.sb.from(t).select('*').order('created_at',{ascending:true}).range(from,from+999);if(eq)for(const k in eq)q=q.eq(k,eq[k]);const {data,error}=await q;if(error)throw error;all=all.concat(data||[]);if(!data||data.length<1000)break;from+=1000}return all},
  async loadAll(){
    const out={},id=this.user.id,admin=S.profile&&S.profile.role==='admin',own=Object.keys(MOD).filter(k=>MOD[k].t!=='master_data').map(k=>MOD[k].t);
    if(this.mode==='demo'){const c=Local.c();own.forEach(t=>out[t]=(c.rows[t]||[]).filter(r=>r.owner===id).map(clone));out.master_data=(c.rows.master_data||[]).map(clone);out.audit_log=(c.audit||[]).filter(a=>admin||a.user_id===id).slice(-400).reverse()}
    else{await Promise.all(own.map(async t=>{out[t]=await this.fetchAll(t,{owner:id})}));out.master_data=await this.fetchAll('master_data');out.audit_log=await this.audit()}
    S.data=out;
  },
  async audit(){
    if(this.mode==='demo'){const c=Local.c(),id=this.user.id,admin=S.profile.role==='admin';return (c.audit||[]).filter(a=>admin||a.user_id===id).slice(-400).reverse()}
    const {data,error}=await this.sb.from('audit_log').select('*').order('created_at',{ascending:false}).limit(300);if(error)throw error;return data||[]
  },
  async insert(t,row){
    row=Object.assign({},row);row.id=row.id||uid();row.owner=this.user.id;
    if(this.mode==='supabase'){const {data,error}=await this.sb.from(t).insert(row).select().single();if(error)throw error;return data}
    const c=Local.c();row.created_at=row.updated_at=nowISO();(c.rows[t]=c.rows[t]||[]).push(row);Local.audit(t,row.id,'INSERT',null,row);Local.save();return clone(row)
  },
  async insertMany(t,rows){
    rows=rows.map(r=>Object.assign({id:uid()},r,{owner:this.user.id}));if(!rows.length)return [];
    if(this.mode==='supabase'){for(let i=0;i<rows.length;i+=400){const {error}=await this.sb.from(t).insert(rows.slice(i,i+400));if(error)throw error}return rows}
    const c=Local.c(),now=nowISO();rows.forEach(r=>{r.created_at=r.updated_at=now});(c.rows[t]=c.rows[t]||[]).push(...rows);Local.save();return rows.map(clone)
  },
  async update(t,id,patch){
    if(this.mode==='supabase'){const {data,error}=await this.sb.from(t).update(patch).eq('id',id).select().single();if(error)throw error;return data}
    const c=Local.c(),r=(c.rows[t]||[]).find(x=>x.id===id);if(!r)throw new Error('Record not found');const old=clone(r);Object.assign(r,patch,{updated_at:nowISO()});Local.audit(t,id,'UPDATE',old,r);Local.save();return clone(r)
  },
  async remove(t,id){
    if(this.mode==='supabase'){const {error}=await this.sb.from(t).delete().eq('id',id);if(error)throw error;return}
    const c=Local.c(),r=(c.rows[t]||[]).find(x=>x.id===id);Local.audit(t,id,'DELETE',clone(r),null);c.rows[t]=(c.rows[t]||[]).filter(x=>x.id!==id);cascade(c.rows,t,id);Local.save()
  },
  async users(){
    if(this.mode==='supabase'){const {data,error}=await this.sb.from('profiles').select('*').order('created_at');if(error)throw error;return data||[]}
    return Local.c().users.map(u=>{const x=clone(u);delete x.password;return x})
  },
  async updateUser(id,patch){
    if(this.mode==='supabase'){const {error}=await this.sb.from('profiles').update(patch).eq('id',id);if(error)throw error}
    else{const u=Local.c().users.find(x=>x.id===id);Object.assign(u,patch);Local.save()}
  },
  async addUserLocal(o){const c=Local.c();if(c.users.find(x=>x.email.toLowerCase()===o.email.toLowerCase()))throw new Error('Email already exists.');c.users.push(Local.mkUser(o));Local.save()},
  async snapshot(){
    if(this.mode==='demo'){const c=Local.c();return {users:await this.users(),activities:(c.rows.activities||[]).map(clone),kpis:(c.rows.kpis||[]).map(clone)}}
    const [users,activities,kpis]=await Promise.all([this.users(),this.fetchAll('activities'),this.fetchAll('kpis')]);return {users,activities,kpis}
  },
  async upload(file){
    if(this.mode!=='supabase')return null;
    const path=`${this.user.id}/${Date.now()}_${file.name.replace(/[^\w.\-]+/g,'_')}`;
    const {error}=await this.sb.storage.from('evidence').upload(path,file);if(error)throw error;return path
  },
  async fileUrl(path){const {data,error}=await this.sb.storage.from('evidence').createSignedUrl(path,3600);if(error)throw error;return data.signedUrl}
};

create extension if not exists pgcrypto;

create table if not exists public.profiles(
  id uuid primary key references auth.users(id) on delete cascade,
  email text, full_name text,
  role text not null default 'user' check (role in ('admin','user')),
  active boolean not null default true,
  organization text, position text, expertise text,
  prefs jsonb not null default '{}'::jsonb,
  created_at timestamptz not null default now());

create or replace function public.is_admin() returns boolean
language sql security definer stable set search_path=public as $$
  select exists(select 1 from public.profiles where id=auth.uid() and role='admin' and active) $$;

create or replace function public.set_updated_at() returns trigger language plpgsql as $$
begin new.updated_at=now(); return new; end $$;

create table if not exists public.audit_log(
  id uuid primary key default gen_random_uuid(),
  user_id uuid, table_name text, record_id uuid, action text,
  old_data jsonb, new_data jsonb,
  created_at timestamptz not null default now());
create index if not exists audit_log_user_idx on public.audit_log(user_id, created_at desc);

create or replace function public.audit_row() returns trigger
language plpgsql security definer set search_path=public as $$
begin
  insert into public.audit_log(user_id,table_name,record_id,action,old_data,new_data)
  values(auth.uid(),TG_TABLE_NAME,coalesce(new.id,old.id),TG_OP,
    case when TG_OP<>'INSERT' then to_jsonb(old) end,
    case when TG_OP<>'DELETE' then to_jsonb(new) end);
  return coalesce(new,old);
end $$;

create or replace function public.handle_new_user() returns trigger
language plpgsql security definer set search_path=public as $$
begin
  insert into public.profiles(id,email,full_name,role)
  values(new.id,new.email,
    coalesce(nullif(new.raw_user_meta_data->>'full_name',''),split_part(new.email,'@',1)),
    case when exists(select 1 from public.profiles) then 'user' else 'admin' end)
  on conflict (id) do nothing;
  return new;
end $$;
drop trigger if exists on_auth_user_created on auth.users;
create trigger on_auth_user_created after insert on auth.users
  for each row execute function public.handle_new_user();

create or replace function public.profiles_guard() returns trigger
language plpgsql security definer set search_path=public as $$
begin
  if (new.role is distinct from old.role or new.active is distinct from old.active)
     and auth.uid() is not null and not public.is_admin() then
    raise exception 'Only an admin can change role or active status';
  end if;
  return new;
end $$;
drop trigger if exists profiles_guard_trg on public.profiles;
create trigger profiles_guard_trg before update on public.profiles
  for each row execute function public.profiles_guard();

alter table public.profiles enable row level security;
drop policy if exists profiles_sel on public.profiles;

const byId=(t,id)=>(D()[t]||[]).find(r=>r.id===id);
function labelOf(t,r){const m=MOD[t];if(m&&m.lab)return m.lab(r);if(t==='portfolios')return ((r.icon||'')+' '+r.name).trim();if(t==='activities')return (r.code?r.code+' ':'')+r.name;return r.name||r.title||r.value||r.id}
function refLabel(t,id){const r=byId(t,id);return r?labelOf(t,r):'—'}
function opts(key){const base=OPT[key]||[];if(base.length&&Array.isArray(base[0]))return base;const extra=(D().master_data||[]).filter(r=>r.category===key&&r.active!==false).sort((a,b)=>num(a.sort_order)-num(b.sort_order)).map(r=>r.value);return [...base,...extra.filter(x=>!base.includes(x))]}
function optList(f){let o=f.opts;if(o==='@masterlists')return MASTER_LISTS;if(typeof o==='string')o=opts(o);return (o||[]).map(x=>Array.isArray(x)?x:[x,x])}
function nextCode(prefix,table){const y=new Date().getFullYear(),rows=D()[table]||[],w=prefix==='PRJ'?3:5;let n=rows.length+1,c;do{c=`${prefix}-${y}-${String(n).padStart(w,'0')}`;n++}while(rows.some(r=>r.code===c));return c}
const isClosed=a=>a.status==='Completed'||a.status==='Cancelled';
const pOf=a=>a.status==='Completed'?100:num(a.progress);
function avgProg(list){const l=list.filter(a=>a.status!=='Cancelled');return l.length?Math.round(avg(l.map(pOf))):null}
function goalProgress(g,depth=0){if(depth>6)return num(g.progress);const kids=D().goals.filter(x=>x.parent_id===g.id),acts=D().activities.filter(a=>a.goal_id===g.id&&a.status!=='Cancelled');const parts=[...kids.map(k=>goalProgress(k,depth+1)),...acts.map(pOf)];return parts.length?Math.round(avg(parts)):num(g.progress)}
function projectProgress(p){const v=avgProg(D().activities.filter(a=>a.project_id===p.id));return v==null?num(p.progress):v}
function planProgress(p){const v=avgProg(D().activities.filter(a=>a.plan_id===p.id));return v==null?num(p.progress):v}
function kpiAch(k){const t=num(k.target),a=num(k.actual);if(k.actual==null||k.actual==='')return 0;if(k.direction==='Lower is better'){if(a<=0)return 100;return Math.min(150,t/a*100)}if(t===0)return a>0?100:0;return Math.min(150,a/t*100)}

function alerts(){const t=todayS(),out=[],A=D().activities||[];
  A.filter(a=>!isClosed(a)&&a.planned_finish&&a.planned_finish<t).forEach(a=>out.push({tone:'red',t:'Overdue activity',m:a.name+' · due '+fmtS(a.planned_finish),k:'activities',id:a.id}));
  A.filter(a=>!isClosed(a)&&a.planned_finish&&a.planned_finish>=t&&diffD(a.planned_finish,t)<=3).forEach(a=>out.push({tone:'orange',t:'Due soon',m:a.name+' · '+fmtS(a.planned_finish),k:'activities',id:a.id}));
  (D().meetings||[]).filter(x=>x.status==='Planned'&&x.meeting_date>=t&&diffD(x.meeting_date,t)<=1).forEach(x=>out.push({tone:'blue',t:x.meeting_date===t?'Meeting today':'Meeting tomorrow',m:x.title+(x.start_time?' · '+tm(x.start_time):''),k:'meetings',id:x.id}));
  (D().meeting_actions||[]).filter(x=>x.status!=='Done'&&x.due_date&&x.due_date<t).forEach(x=>out.push({tone:'red',t:'Action item overdue',m:x.action,k:'meeting_actions',id:x.id}));
  (D().milestones||[]).filter(x=>x.status!=='Achieved'&&x.due_date&&diffD(x.due_date,t)<=7&&diffD(x.due_date,t)>=-30).forEach(x=>out.push({tone:diffD(x.due_date,t)<0?'red':'amber',t:diffD(x.due_date,t)<0?'Milestone late':'Milestone soon',m:x.name+' · '+fmtS(x.due_date),k:'milestones',id:x.id}));
  (D().competencies||[]).filter(c=>c.expiry_date&&diffD(c.expiry_date,t)<=60&&diffD(c.expiry_date,t)>=-365&&c.status!=='Planned').forEach(c=>out.push({tone:diffD(c.expiry_date,t)<0?'red':'amber',t:diffD(c.expiry_date,t)<0?'Certificate expired':'Certificate expiring',m:c.name+' · '+fmtS(c.expiry_date),k:'competencies',id:c.id}));
  (D().risks||[]).filter(r=>r.status==='Open'&&riskScore(r)>=15).forEach(r=>out.push({tone:'red',t:'High risk open',m:r.title,k:'risks',id:r.id}));
  const d=new Date();
  if(d.getDay()===5&&!(D().reviews||[]).some(r=>r.review_type==='Weekly'&&r.period_end>=weekStart(t)))out.push({tone:'blue',t:'Friday review',m:'Review the week and pick 1–2 improvements.',go:['performance','reviews']});

function attention(){
  const t=todayS(),items=[];
  (D().activities||[]).filter(a=>!isClosed(a)).forEach(a=>{const fl=flags(a);if(fl.length)items.push({rank:Math.max(...fl.map(x=>x[2])),date:a.planned_finish||'9999',title:a.name,meta:'Activity · '+(a.planned_finish?'due '+fmtS(a.planned_finish):'no date'),flags:fl,k:'activities',id:a.id})});
  (D().milestones||[]).filter(x=>x.status!=='Achieved'&&x.due_date&&diffD(x.due_date,t)<=7).forEach(x=>{const late=x.due_date<t;items.push({rank:late?3:2,date:x.due_date,title:x.name,meta:'Milestone · '+fmtS(x.due_date),flags:[[late?'Overdue':'Urgent',late?'red':'orange']],k:'milestones',id:x.id})});
  (D().meeting_actions||[]).filter(x=>x.status!=='Done'&&x.due_date&&diffD(x.due_date,t)<=3).forEach(x=>{const late=x.due_date<t;items.push({rank:late?4:2,date:x.due_date,title:x.action,meta:'Action item · '+fmtS(x.due_date),flags:[[late?'Overdue':'Urgent',late?'red':'orange']],k:'meeting_actions',id:x.id})});
  (D().risks||[]).filter(r=>r.status==='Open'&&riskScore(r)>=15).forEach(r=>items.push({rank:3,date:r.due_date||'9999',title:r.title,meta:'Risk · score '+riskScore(r),flags:[['Critical','red']],k:'risks',id:r.id}));
  (D().problems||[]).filter(p=>!['Closed','Verified'].includes(p.status)&&['Critical','High'].includes(p.severity)).forEach(p=>items.push({rank:p.severity==='Critical'?3:1,date:p.due_date||'9999',title:p.title,meta:'Problem · '+p.status,flags:[[p.severity==='Critical'?'Critical':'Highlight',p.severity==='Critical'?'red':'amber']],k:'problems',id:p.id}));
  return items.sort((a,b)=>b.rank-a.rank||String(a.date).localeCompare(String(b.date)));
}
function weeklyCounts(n){const t=todayS(),w0=weekStart(t),labels=[],a=[],d=[];
  for(let i=n-1;i>=0;i--){const ws=addD(w0,-7*i),we=addD(ws,6);labels.push(fmtS(ws));
    a.push((D().activities||[]).filter(x=>x.completed_on&&x.completed_on>=ws&&x.completed_on<=we).length);
    d.push((D().daily_actions||[]).filter(x=>x.status==='Completed'&&x.action_date>=ws&&x.action_date<=we).length)}
  return {labels,a,d}}
function peakHours(){const m={};(D().daily_actions||[]).filter(x=>x.energy&&x.start_time).forEach(x=>{const h=+tm(x.start_time).slice(0,2);(m[h]=m[h]||[]).push(+x.energy)});
  return Object.keys(m).map(h=>({h:+h,avg:avg(m[h]),n:m[h].length})).sort((a,b)=>a.h-b.h)}
function bestHour(){const p=peakHours().filter(x=>x.n>=2).sort((a,b)=>b.avg-a.avg||b.n-a.n);return p[0]||null}

  const row2=`<div class="g g21 mt"><div class="card"><div class="ch"><h3>Needs attention</h3><span class="badge b-red">Critical</span><span class="badge b-orange">Urgent</span><span class="badge b-amber">Highlight</span><span class="sp"></span><button class="btn s" data-act="go" data-p="execute" data-s="activities">All activities</button></div>${attHtml}</div><div class="card"><div class="ch"><h3>Progress status</h3></div>${statusPie}</div></div>`;
  const w0=addD(weekStart(t),-7),w1=addD(w0,56);let tl=[];

   <div class="card"><div class="ch"><h3>Goals</h3><span class="sp"></span><button class="btn s" data-act="go" data-p="plan" data-s="goals">Goals</button></div>${goals.length?`<div class="list">${goals.map(g=>`<div class="item" data-act="open" data-k="goals" data-id="${g.id}"><span class="t" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(g.title)}</span><span style="width:120px">${pbar(goalProgress(g))}</span></div>`).join('')}</div>`:'<div class="empty-mini">No goals yet.</div>'}</div></div>`;

};

const periodRange=(y,p)=>p==='H1'?[`${y}-01-01`,`${y}-06-30`]:p==='H2'?[`${y}-07-01`,`${y}-12-31`]:[`${y}-01-01`,`${y}-12-31`];

function perfMetrics(y,p){
  const [a,b]=periodRange(y,p),A=D().activities||[],ev=D().evidence||[],dt=x=>x.planned_finish||x.planned_start;
  const acts=A.filter(x=>x.status!=='Cancelled'&&dt(x)&&dt(x)>=a&&dt(x)<=b),done=acts.filter(x=>x.status==='Completed');
  const goals=(D().goals||[]).filter(g=>g.type==='Goal'&&(!g.end_date||g.end_date>=a)&&(!g.start_date||g.start_date<=b));
  const ot=done.filter(x=>x.planned_finish&&x.completed_on),withEv=done.filter(x=>x.link||ev.some(e=>e.link_type==='activities'&&e.link_id===x.id));
  const imps=(D().improvements||[]).filter(x=>{const d=x.start_date||x.due_date||String(x.created_at).slice(0,10);return d>=a&&d<=b});
  const comps=(D().competencies||[]).filter(x=>x.date_end&&x.date_end>=a&&x.date_end<=b&&x.status!=='Expired');
  const probs=(D().problems||[]).filter(x=>x.date_found&&x.date_found>=a&&x.date_found<=b),hrs=done.filter(x=>num(x.est_hours)&&num(x.actual_hours));
  const pc=(n,d)=>d?n/d*100:null;
  return {acts,done,goals,comps,m:[
   ['Goal achievement',goals.length?avg(goals.map(g=>goalProgress(g))):null,goals.length+' goals in this period'],
   ['Activity completion',pc(done.length,acts.length),done.length+' of '+acts.length+' activities'],
   ['On-time delivery',pc(ot.filter(x=>x.completed_on<=x.planned_finish).length,ot.length),'completed on or before the planned finish'],
   ['Evidence compliance',pc(withEv.length,done.length),'completed activities that have proof'],
   ['Improvement',pc(imps.filter(x=>['Standardized','Closed'].includes(x.status)).length,imps.length),imps.length+' improvement cycles'],
   ['Competency development',pc(comps.filter(x=>x.status==='Completed').length,comps.length),comps.length+' trainings or certificates'],
   ['Productivity (plan vs actual)',hrs.length?Math.min(150,sum(hrs.map(x=>x.est_hours))/sum(hrs.map(x=>x.actual_hours))*100):null,'estimated hours ÷ actual hours'],
   ['Quality (problems resolved)',pc(probs.filter(x=>['Verified','Closed'].includes(x.status)).length,probs.length),probs.length+' problems logged']]}}
const rating=s=>s>=100?['Outstanding','green']:s>=90?['Excellent','green']:s>=75?['Good','blue']:s>=60?['Fair','amber']:['Needs improvement','red'];

  (D().projects||[]).filter(p=>p.start_date&&p.end_date&&!['Completed','Cancelled'].includes(p.status)).forEach(p=>items.push({k:'projects',id:p.id,name:p.name,type:'Project',s:p.start_date,e:p.end_date,act:projectProgress(p)}));

  items.forEach(i=>{const tot=Math.max(1,diffD(i.e,i.s));i.plan=clamp(diffD(t,i.s)/tot*100,0,100);i.v=i.act-i.plan;i.st=i.v>=-5?['On track','green']:i.v>=-20?['At risk','amber']:['Delayed','red']});

  const slice=items.slice(0,8);

const WBM=m=>m==='5 Whys'?'why':m==='Fishbone (Ishikawa)'?'fish':m==='FMEA'?'fmea':m==='Pareto 80/20'?'pareto':'notes';
const M6=['Man (people)','Machine','Method','Material','Measurement','Environment'];
function wbRow(m,r,i){r=r||{};
  if(m==='fmea')return `<div class="card flat wbr" style="padding:10px;margin-bottom:8px;background:var(--soft)"><div class="fgrid"><div class="fld"><label>Item / process step</label><input class="in" data-wb="item" value="${esc(r.item||'')}"></div><div class="fld"><label>Failure mode</label><input class="in" data-wb="mode" value="${esc(r.mode||'')}"></div><div class="fld"><label>Effect of failure</label><input class="in" data-wb="effect" value="${esc(r.effect||'')}"></div><div class="fld"><label>Recommended action</label><input class="in" data-wb="action" value="${esc(r.action||'')}"></div></div>
   <div class="row" style="margin-top:8px"><label class="sm">Severity <input class="in" style="width:70px" type="number" min="1" max="10" data-wb="s" data-input="wbcalc" value="${esc(r.s||'')}"></label><label class="sm">Occurrence <input class="in" style="width:70px" type="number" min="1" max="10" data-wb="o" data-input="wbcalc" value="${esc(r.o||'')}"></label><label class="sm">Detection <input class="in" style="width:70px" type="number" min="1" max="10" data-wb="d" data-input="wbcalc" value="${esc(r.d||'')}"></label><span class="sp"></span><span>RPN <b class="badge" data-rpn>${num(r.s)*num(r.o)*num(r.d)||'—'}</b></span><button class="btn s d" data-act="wbdel" data-i="${i}" aria-label="Remove row">${ic('trash',14)}</button></div></div>`;
  return `<div class="row wbr" style="margin-bottom:6px"><input class="in" style="flex:1" placeholder="Cause" data-wb="l" data-input="wbcalc" value="${esc(r.l||'')}"><input class="in" style="width:100px" type="number" min="0" placeholder="Count" data-wb="v" data-input="wbcalc" value="${esc(r.v||'')}"><button class="btn s d" data-act="wbdel" data-i="${i}" aria-label="Remove row">${ic('trash',14)}</button></div>`}
function wbHtml(m,a){a=a||{};
  if(m==='why')return `<p class="sm ink2" style="margin-bottom:10px">Ask “why?” until you reach a cause you can fix. Stop when the answer is a process or a system, not a person.</p>${[0,1,2,3,4].map(i=>`<div class="fld" style="margin-bottom:10px"><label>Why ${i+1}?</label><input class="in" data-wb="why" value="${esc((a.whys||[])[i]||'')}"></div>`).join('')}<div class="fld"><label>Root cause</label><textarea class="in" rows="2" data-wb="root">${esc(a.root||'')}</textarea><p class="help">Copied to the problem's “Root cause” field when you save.</p></div>`;
  if(m==='fish')return `<div class="fld" style="margin-bottom:12px"><label>Effect (the problem)</label><input class="in" data-wb="effect" value="${esc(a.effect||'')}"><p class="help">The head of the fish: what went wrong, in one sentence.</p></div><div class="g g3">${M6.map((c,i)=>`<div class="fld"><label>${c}</label><textarea class="in" rows="4" data-wb="cat" data-c="${c}" placeholder="One possible cause per line">${esc(((a.cats||{})[c])||'')}</textarea></div>`).join('')}</div><p class="help" style="margin-top:8px">List every possible cause under each of the 6M categories, then circle the most likely ones and verify them with data.</p><div class="fld" style="margin-top:10px"><label>Root cause</label><textarea class="in" rows="2" data-wb="root">${esc(a.root||'')}</textarea></div>`;
  if(m==='fmea'){const r=a.rows&&a.rows.length?a.rows:[{}];return `<p class="sm ink2" style="margin-bottom:10px">Score each failure mode 1–10 for Severity, Occurrence and Detection (10 = hardest to detect). RPN = S × O × D; act first on RPN ≥ 100.</p><div id="wbrows">${r.map((x,i)=>wbRow('fmea',x,i)).join('')}</div><button class="btn s" data-act="wbadd">${ic('plus',14)} Add failure mode</button>`}
  if(m==='pareto'){const r=a.rows&&a.rows.length?a.rows:[{},{},{}];return `<p class="sm ink2" style="margin-bottom:10px">List causes with how often each occurred. The orange bars are the vital few that make up about 80% of the problem.</p><div id="wbrows">${r.map((x,i)=>wbRow('pareto',x,i)).join('')}</div><button class="btn s" data-act="wbadd">${ic('plus',14)} Add cause</button><div id="wbchart" style="margin-top:12px">${paretoChart(r.map(x=>({l:x.l||'',v:num(x.v)})))}</div>`}
  return `<div class="fld"><label>Analysis notes</label><textarea class="in" rows="10" data-wb="notes">${esc(a.notes||'')}</textarea><p class="help">Free-form space for RCA, FEA, ELA, 8D or A3 notes: timeline, evidence, causes and conclusions.</p></div>`}
function wbCollect(m){const q=s=>$$(s,$('#wb'));
  if(m==='why')return {whys:q('[data-wb=why]').map(e=>e.value.trim()),root:(q('[data-wb=root]')[0]||{}).value||''};
  if(m==='fish'){const cats={};q('[data-wb=cat]').forEach(e=>cats[e.dataset.c]=e.value);return {effect:(q('[data-wb=effect]')[0]||{}).value||'',cats,root:(q('[data-wb=root]')[0]||{}).value||''}}
  if(m==='fmea')return {rows:q('.wbr').map(r=>{const g=k=>(r.querySelector(`[data-wb=${k}]`)||{}).value||'';return {item:g('item'),mode:g('mode'),effect:g('effect'),action:g('action'),s:g('s'),o:g('o'),d:g('d')}})};
  if(m==='pareto')return {rows:q('.wbr').map(r=>({l:r.querySelector('[data-wb=l]').value,v:r.querySelector('[data-wb=v]').value}))};
  return {notes:(q('[data-wb=notes]')[0]||{}).value||''}}
ACT.wb=el=>{const p=byId('problems',el.dataset.id),m=WBM(p.method);closeModal(true);
  openModal(`Analysis · ${esc(p.method||'')}`,`<p class="sm mut" style="margin-bottom:10px">${esc(p.title)}</p><div id="wb" data-id="${p.id}" data-m="${m}">${wbHtml(m,p.analysis)}</div>`,`<button class="btn" data-act="closeModal">Cancel</button><button class="btn p" data-act="wbsave">${ic('check')} Save analysis</button>`,'wide')};
ACT.wbsave=async()=>{const w=$('#wb'),id=w.dataset.id,m=w.dataset.m,a=wbCollect(m),p=byId('problems',id),patch={analysis:a};
  let rc=a.root;if(m==='why'&&!rc){const last=a.whys.filter(Boolean).pop();rc=last}
  if(rc&&!p.root_cause)patch.root_cause=rc;if(p.status==='Open')patch.status='Analysis';
  await patchRow('problems',id,patch);closeModal(true);toast('Analysis saved');render()};
ACT.wbadd=()=>{const w=$('#wb'),m=w.dataset.m,cur=wbCollect(m).rows;cur.push({});$('#wbrows').innerHTML=cur.map((x,i)=>wbRow(m,x,i)).join('');if(m==='pareto')CHG.wbcalc()};
ACT.wbdel=el=>{const w=$('#wb'),m=w.dataset.m,cur=wbCollect(m).rows;cur.splice(+el.dataset.i,1);if(!cur.length)cur.push({});$('#wbrows').innerHTML=cur.map((x,i)=>wbRow(m,x,i)).join('');if(m==='pareto')CHG.wbcalc()};
CHG.wbcalc=el=>{const w=$('#wb');if(!w)return;if(w.dataset.m==='fmea'&&el){const r=el.closest('.wbr'),g=k=>num((r.querySelector(`[data-wb=${k}]`)||{}).value),n=g('s')*g('o')*g('d'),b=r.querySelector('[data-rpn]');b.textContent=n||'—';b.className='badge '+(n>=100?'b-red':n>=50?'b-amber':n?'b-green':'')}
  if(w.dataset.m==='pareto'){const c=$('#wbchart');if(c)c.innerHTML=paretoChart(wbCollect('pareto').rows.map(x=>({l:x.l,v:num(x.v)})))}};
EXTRA.problems=p=>{const a=p.analysis;let s='';
  if(a&&a.whys)s=`<div class="ch" style="margin-top:14px"><h3>5 Whys</h3></div><div class="flow">${a.whys.filter(Boolean).map((w,i)=>`<span class="st">Why ${i+1}: ${esc(w)}</span>${i<a.whys.filter(Boolean).length-1?'<span class="ar">→</span>':''}`).join('')}</div>`;
  else if(a&&a.cats)s=`<div class="ch" style="margin-top:14px"><h3>Fishbone: ${esc(a.effect||'')}</h3></div><div class="g g3">${M6.map(c=>`<div class="card flat" style="background:var(--soft);padding:10px"><b>${c}</b><div class="sm" style="white-space:pre-wrap">${esc((a.cats||{})[c]||'—')}</div></div>`).join('')}</div>`;
  else if(a&&a.rows&&a.rows[0]&&a.rows[0].mode!==undefined)s=`<div class="ch" style="margin-top:14px"><h3>FMEA</h3></div><div class="tw"><table class="tbl stack"><thead><tr><th>Item</th><th>Failure mode</th><th>Effect</th><th>S</th><th>O</th><th>D</th><th>RPN</th></tr></thead><tbody>${a.rows.filter(r=>r.mode||r.item).map(r=>{const n=num(r.s)*num(r.o)*num(r.d);return `<tr><td>${esc(r.item)}</td><td data-l="Failure mode">${esc(r.mode)}</td><td data-l="Effect">${esc(r.effect)}</td><td data-l="S">${esc(r.s)}</td><td data-l="O">${esc(r.o)}</td><td data-l="D">${esc(r.d)}</td><td data-l="RPN"><span class="badge b-${n>=100?'red':n>=50?'amber':'green'}">${n||'—'}</span></td></tr>`}).join('')}</tbody></table></div>`;
  else if(a&&a.rows)s=`<div class="ch" style="margin-top:14px"><h3>Pareto</h3></div>${paretoChart(a.rows.map(x=>({l:x.l,v:num(x.v)})))}`;
  else if(a&&a.notes)s=`<div class="ch" style="margin-top:14px"><h3>Analysis notes</h3></div><p style="white-space:pre-wrap">${esc(a.notes)}</p>`;

 ['Set up your profile and life areas','Open Settings → Profile and add your name, organisation and expertise. Then go to Plan → Life Areas and tap “Add default life areas” (Work, Project, Investment, Trading, Hobby, Family, Ibadah, Health …). Delete or rename what you do not need.','plan','areas','Open Life Areas'],

function auditSummary(a){const n=a.new_data||{},o=a.old_data||{},lab=n.name||n.title||n.action||n.value||n.instrument||o.name||o.title||o.action||o.value||o.instrument||'';
  if(a.action==='UPDATE'){const ch=Object.keys(n).filter(k=>k!=='updated_at'&&JSON.stringify(n[k])!==JSON.stringify(o[k]));return (lab?lab+' — ':'')+'changed '+(ch.slice(0,5).join(', ')||'nothing')+(ch.length>5?'…':'')}

CHG.importfile=async el=>{const f=el.files[0];if(!f)return;try{const o=JSON.parse(await f.text());if(o.app!=='tuntas')throw new Error('This is not a Tuntas backup file.');let n=0;
  for(const t of ORDER){const have=new Set((D()[t]||[]).map(r=>r.id)),rows=(o[t]||[]).filter(r=>!have.has(r.id)).map(r=>{const x=Object.assign({},r);delete x.owner;return x});if(rows.length){const ins=await DB.insertMany(t,rows);D()[t]=(D()[t]||[]).concat(ins);n+=ins.length}}

ACT.wipe=async()=>{if(!await ask('Delete all your data?','Every life area, goal, plan, activity, KPI, meeting and more in your account will be removed. This cannot be undone. Export a backup first if unsure.','Delete everything',true))return;
  if(DB.mode==='demo'){const c=Local.c();Object.keys(c.rows).forEach(t=>{if(t!=='master_data')c.rows[t]=c.rows[t].filter(r=>r.owner!==DB.user.id)});Local.save()}
  else{for(const t of [...ORDER].reverse()){const {error}=await DB.sb.from(t).delete().eq('owner',DB.user.id);if(error)throw error}}

  add('processes',{name:'PMA drawing release SOP',type:'SOP',portfolio_id:P('Work'),purpose:'Make sure every drawing is checked and released the same way.',steps:'Draft drawing\nSelf-check against requirements\nPeer review\nQuality check\nApprove and release\nNotify team and archive',version:'1.2',process_owner:me,review_date:d(90),status:'Active'});
  add('processes',{name:'Weekly review checklist',type:'Checklist',purpose:'A short ritual to close the week.',steps:'Score the week\'s outcomes\nList wins and gaps\nPick 1–2 improvements\nPlan Monday\'s Top 3',version:'1.0',status:'Active'});
  add('improvements',{title:'Standard checklist before DGCA submission',method:'PDCA',portfolio_id:P('Work'),problem_id:p1,plan_text:'Create a one-page pre-submission checklist to avoid missing documents.',do_text:'Piloted on the last package.',check_text:'Found 3 missing items before submission.',act_text:'Adopt for all packages; add to the SOP.',expected_benefit:'Avoid 1 rejection per year',start_date:d(-20),due_date:d(15),status:'Checking'});
  add('improvements',{title:'Track supplier lead-time every week',method:'Kaizen',portfolio_id:P('Work'),plan_text:'Add a lead-time column to the project tracker and review weekly.',expected_benefit:'Spot delays 1 week earlier',status:'Idea'});
  add('knowledge',{title:'Lesson: confirm the material certificate before machining',category:'Lesson Learned',portfolio_id:P('Work'),content:'We lost two days because the certificate did not match the batch number. Always check the batch number on the certificate against the stock tag before cutting.',tags:'material, quality'});
  add('knowledge',{title:'CASR Part 21 quick reference',category:'Reference',portfolio_id:P('Aviation'),content:'Key sections for design approval and PMA. Use it when preparing a submission.',url:'https://example.com/casr-part-21',tags:'regulation, DGCA'});
  /* finance */
  [['XAUUSD','Sell',250000],['XAUUSD','Buy',-120000],['EURUSD','Sell',410000],['XAUUSD','Buy',-90000],['XAUUSD','Sell',300000],['GBPUSD','Buy',150000]].forEach((x,i)=>add('finance_entries',{entry_date:d(-26+i*4),category:'Trading',instrument:x[0],action:x[1],quantity:0.1,amount:5000000,currency:'IDR',pnl:x[2],strategy:'Breakout H1',trade_plan:'Entry on breakout close, stop below structure, target 2R.',notes:x[2]>0?'Followed the plan.':'Entered early. Wait for the close.'}));
  add('finance_entries',{entry_date:d(-20),category:'Investment',instrument:'Reksadana pasar uang',action:'Buy',amount:5000000,currency:'IDR',strategy:'Monthly DCA'});
  add('finance_entries',{entry_date:d(-15),category:'Investment',instrument:'BBCA',action:'Buy',quantity:10,price:9800,amount:9800000,currency:'IDR',strategy:'Dividend core holding'});
  add('finance_entries',{entry_date:d(-8),category:'Income',instrument:'Freelance payment',action:'Deposit',amount:8000000,currency:'IDR'});
  /* habits + logs */
  const hab=[...PACK_IBADAH.slice(0,8),PACK_LIFE[0],PACK_LIFE[1]].map(h=>({id:uid(),name:h[0],category:h[1],target_per_week:h[2],icon:h[3],active:true}));
  const logs=[];hab.forEach((h,hi)=>{for(let i=0;i<21;i++){if(((i*7+hi*5)%10)<(h.target_per_week>=7?8:6))logs.push({habit_id:h.id,log_date:d(-i),done:true})}});
  R.habits=hab;R.habit_logs=logs;
  add('reviews',{review_type:'Weekly',period_start:addD(ws,-7),period_end:addD(ws,-1),score:78,wins:'• Drawing rev A approved\n• Finished 5 of 7 planned Top-3 items',gaps:'• Material PO delayed\n• Two evenings lost to meetings',insights:'Deep work before 10:00 is when I deliver most.',next_actions:'Close NCR first. Block 08:30–10:30 daily.',improvement_ideas:'1. No meetings before 10:00\n2. Plan tomorrow every evening'});
  /* insert in dependency order */
  for(const tb of ORDER){if(tb==='portfolios'||!R[tb])continue;const ins=await DB.insertMany(tb,R[tb]);D()[tb]=(D()[tb]||[]).concat(ins)}
}

/* =====================================================================
   LOGIN
   ===================================================================== */
S.loginMode='in';
function showLogin(msg,ok){
  document.body.classList.remove('nav');$('#layer').innerHTML='';
  const demo=DB.mode==='demo',c=getCfg(),sbMissing=c.url&&c.key&&!c.demo&&!window.supabase,signup=S.loginMode==='up';
  $('#root').innerHTML=`<div class="login" style="background:#fff;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)">
   <div class="l" style="padding:48px;display:flex;flex-direction:column;justify-content:center;gap:20px;background:var(--soft)"><div class="brand" style="padding:0">${LOGO.replace('<svg','<svg style="width:56px;height:56px"')}<div><b style="font-size:34px">${APP_NAME}</b></div></div>
    <h1 style="font:700 40px/1.08 var(--serif);letter-spacing:-.03em;max-width:13ch">Plan it. Do it. Prove it.</h1>
    <p class="ink2" style="max-width:44ch;font-size:15px">One place for office work, projects, freelance, trading, investment, family time and ibadah — from the annual goal down to today's next action, with the evidence to show for it.</p>
    <ul class="ink2" style="margin:0;padding-left:18px;line-height:1.9"><li>Five planning horizons, one daily action loop</li><li>KPI summaries for half-year and annual reviews</li><li>Evidence, meetings, problem solving and continuous improvement</li><li>Works on phone, tablet and computer</li></ul></div>
   <div class="r" style="padding:32px;display:flex;align-items:center;justify-content:center"><div style="width:100%;max-width:400px">
    <h2 style="font:700 26px var(--serif);margin-bottom:4px">${signup?'Create your account':'Welcome back'}</h2>
    <p class="sm mut" style="margin-bottom:14px">${demo?'Demo mode — data stays in this browser.':'Connected to your Supabase database.'}</p>
    ${msg?`<div class="callout" style="${ok?'':'background:var(--redsoft);color:#8a2222'}">${ic(ok?'check':'alert')}<div>${esc(msg)}</div></div>`:''}
    ${sbMissing?`<div class="callout warn" style="background:var(--ambersoft);color:#6B4400">${ic('alert')}<div>The Supabase library could not be loaded (offline or blocked), so the app is running in demo mode.</div></div>`:''}
    <form id="lform" onsubmit="ACT.dologin();return false" autocomplete="on">
     ${signup?`<div class="fld" style="margin-bottom:12px"><label for="l_name">Full name</label><input class="in" id="l_name" name="name" autocomplete="name"><p class="help">How your name appears in the app.</p></div>`:''}
     <div class="fld" style="margin-bottom:12px"><label for="l_email">Email</label><input class="in" id="l_email" name="email" type="email" autocomplete="email" required><p class="help">Your sign-in email.</p></div>
     <div class="fld" style="margin-bottom:14px"><label for="l_pw">Password</label><input class="in" id="l_pw" name="password" type="password" autocomplete="${signup?'new-password':'current-password'}" required minlength="6"><p class="help">${signup?'At least 6 characters.':'Your account password.'}</p></div>
     <button class="btn p" style="width:100%;justify-content:center;padding:11px" type="submit">${signup?'Create account':'Sign in'}</button></form>
    <p class="sm c" style="margin-top:12px">${signup?'Already have an account?':'New here?'} <button class="link" data-act="loginmode">${signup?'Sign in':'Create an account'}</button></p>
    ${demo?`<hr style="margin:18px 0"><p class="sm b" style="margin-bottom:8px">Try the demo with sample data</p><div class="row"><button class="btn" data-act="demologin" data-e="admin@demo.app" data-p="admin123">${ic('shield',15)} Demo Admin</button><button class="btn" data-act="demologin" data-e="user@demo.app" data-p="user123">${ic('user',15)} Demo User</button></div><p class="help" style="margin-top:6px">Admin sees user management, master data and the audit trail. User sees personal modules only.</p>`:''}
    <p class="sm c" style="margin-top:18px"><button class="link" data-act="connmodal">${ic('cog',14)} Database settings</button></p></div></div></div>`;
  if(window.innerWidth<860){const l=$('.login');l.style.gridTemplateColumns='1fr';$('.login .l').style.padding='24px 20px'}
}
ACT.loginmode=()=>{S.loginMode=S.loginMode==='in'?'up':'in';showLogin()};
ACT.dologin=async()=>{const f=$('#lform').elements,email=f.email.value.trim(),pw=f.password.value;if(!email||pw.length<6)return showLogin('Enter your email and a password of at least 6 characters.');
  try{if(S.loginMode==='up'){const r=await DB.signUp(email,pw,(f.name&&f.name.value.trim())||'');if(r==='confirm'){S.loginMode='in';return showLogin('Account created. Check your email to confirm it, then sign in.',true)}}else await DB.signIn(email,pw);await startApp()}
  catch(e){console.error(e);showLogin(e.message||'Could not sign in')}};
ACT.demologin=async el=>{try{await DB.signIn(el.dataset.e,el.dataset.p);await startApp()}catch(e){showLogin(e.message)}};
ACT.connmodal=()=>{const c=getCfg();openModal('Database settings',`<p class="sm ink2" style="margin-bottom:12px">Paste your Supabase project values to store data in your own SQL database. Leave empty to stay in demo mode. The SQL schema is available after you sign in (Settings → Database).</p><form id="cform" onsubmit="return false"><div class="fgrid"><div class="fld wide"><label>Supabase project URL</label><input class="in" name="url" placeholder="https://xxxxxxxx.supabase.co" value="${esc(c.url||'')}"><p class="help">Project Settings → API → Project URL.</p></div><div class="fld wide"><label>Anon public key</label><input class="in" name="key" value="${esc(c.key||'')}"><p class="help">The public “anon” key, never the service_role key.</p></div></div></form>`,`${c.url?`<button class="btn" data-act="democfg">Use demo mode</button>`:''}<button class="btn" data-act="closeModal">Cancel</button><button class="btn p" data-act="savecfg">Save and reload</button>`)};

/* =====================================================================
   BOOT
   ===================================================================== */
function showFatal(e){console.error(e);const m=String(e&&e.message||e);
  $('#root').innerHTML=`<div class="login" style="display:grid;place-items:center;padding:20px"><div class="card" style="max-width:520px"><h2 style="font:700 22px var(--serif);margin-bottom:8px">The database is not ready</h2><p class="ink2">${esc(m)}</p><p class="sm ink2" style="margin:10px 0">If this is a new Supabase project, open <b>SQL Editor</b>, paste the schema (Settings → Database in demo mode, or the <b>schema.sql</b> file) and run it once. Then reload.</p><div class="row"><button class="btn p" onclick="location.reload()">Reload</button><button class="btn" data-act="democfg">Switch to demo mode</button><button class="btn" data-act="logout">Sign out</button></div></div></div>`}
async function startApp(){
  S.profile=await DB.getProfile();
  if(S.profile.active===false){await DB.signOut();return showLogin('This account is deactivated. Ask an admin.')}
  try{await DB.loadAll()}catch(e){return showFatal(e)}
  if(DB.mode==='demo'&&['admin@demo.app','user@demo.app'].includes(S.profile.email)&&!S.profile.seeded&&!(D().activities||[]).length&&!(D().portfolios||[]).length){try{await seedSample();await DB.saveProfile({seeded:true});S.profile.seeded=true}catch(e){console.error(e)}}
  mountShell();S.route={p:'dashboard',s:'overview'};parseHash();render();
  if(S.profile._missing)toast('Profile row not found — run the SQL schema in Supabase.',1);
}
(async function boot(){
  try{await DB.init()}catch(e){console.error(e)}
  if(DB.user)startApp().catch(showFatal);else showLogin();
})();
</script>
