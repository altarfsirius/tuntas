const SRC={};
const defSrc=o=>{SRC[o.id]=o};
const readSrc=id=>{try{return JSON.parse(store.get('tuntas.src.'+id))}catch(e){return null}};
const sst=id=>S.src[id]||(S.src[id]=readSrc(id)||{});
async function srcLoad(id,force){
  const o=SRC[id],st=sst(id),key=o.key?String(o.key()):'';
  if(st.loading)return st.loading;
  if(!force&&st.data&&st.key===key&&Date.now()-st.at<o.ttl*60e3)return st;
  if(!force&&st.err&&st.errKey===key&&Date.now()-st.err.at<120e3)return st;
  st.loading=(async()=>{
    try{const data=await o.fetch();st.data=data;st.at=Date.now();st.key=key;st.err=null;store.set('tuntas.src.'+id,JSON.stringify({data,at:st.at,key}))}
    catch(e){st.err={msg:e.message,at:Date.now()};st.errKey=key}
    finally{st.loading=null}return st})();
  return st.loading}

function gauge(v,label){
  const cx=110,cy=108,R=88,pt=(deg,r)=>[cx+r*Math.cos(deg*Math.PI/180),cy-r*Math.sin(deg*Math.PI/180)],cols=['#D64545','#E8631A','#D9A100','#7DBB4A','#1E9B56'];
  const arc=(i)=>{const a=180-i*36,b=180-(i+1)*36,p=pt(a,R),q=pt(b,R);return `<path d="M${p[0].toFixed(1)} ${p[1].toFixed(1)} A${R} ${R} 0 0 1 ${q[0].toFixed(1)} ${q[1].toFixed(1)}" stroke="${cols[i]}" stroke-width="16" fill="none"/>`};
  const n=pt(180-clamp(v,0,100)*1.8,70);
  return `<svg viewBox="0 0 220 142" class="chart" role="img" aria-label="Fear and greed index ${v}, ${esc(label)}" style="max-width:260px;margin:auto">${[0,1,2,3,4].map(arc).join('')}<line x1="${cx}" y1="${cy}" x2="${n[0].toFixed(1)}" y2="${n[1].toFixed(1)}" stroke="#12263A" stroke-width="3" stroke-linecap="round"/><circle cx="${cx}" cy="${cy}" r="6" fill="#12263A"/><text x="${cx}" y="${cy+32}" text-anchor="middle" font-size="24" font-weight="800" fill="#12263A">${v}</text></svg>`}
function trendChart(pts,{h=190,fmt=v=>fmtN(v,0)}={}){
  if(pts.length<2)return '<div class="empty-mini">Not enough data for a trend.</div>';
  const W=560,pl=54,pb=24,pt=12,iw=W-pl-10,ih=h-pb-pt,ys=pts.map(p=>p.y),lo=Math.min(...ys),hi=Math.max(...ys),pad=(hi-lo)*.1||1,mn=lo-pad,mx=hi+pad,rg=mx-mn;
  const X=i=>pl+iw*i/(pts.length-1),Y=v=>pt+ih-ih*(v-mn)/rg;let g='';
  for(let i=0;i<=4;i++){const v=mn+rg*i/4,y=Y(v);g+=`<line x1="${pl}" x2="${W-10}" y1="${y}" y2="${y}" stroke="#E6EAF0"/><text x="${pl-6}" y="${y+4}" text-anchor="end" font-size="10" fill="#8592A6">${fmt(v)}</text>`}
  const path=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join(' '),step=Math.ceil(pts.length/6);
  const lbl=pts.map((p,i)=>i%step===0||i===pts.length-1?`<text x="${X(i)}" y="${h-6}" text-anchor="middle" font-size="10" fill="#8592A6">${fmtS(p.d)}</text>`:'').join('');
  return `<svg viewBox="0 0 ${W} ${h}" class="chart" role="img" aria-label="Trend chart">${g}<path d="${path} L${X(pts.length-1)},${pt+ih} L${pl},${pt+ih}Z" fill="#0E7C66" opacity=".08"/><path d="${path}" fill="none" stroke="#0E7C66" stroke-width="2"/>${lbl}</svg>`}
function fxConvText(){const L=sst('fx_latest').data;if(!L)return '—';const amt=num(S.ui.fxAmt)||1,from=S.ui.fxFrom||'USD',to=S.ui.fxTo||'IDR',rate=c=>c===L.base?1:L.rates[c];
  return rate(from)&&rate(to)?fmtN(amt*rate(to)/rate(from),to==='JPY'||to==='IDR'||to==='KRW'?0:4):'—'}
const usdIdr=L=>{if(!L)return null;const idr=L.base==='IDR'?1:L.rates.IDR,usd=L.base==='USD'?1:L.rates.USD;return idr&&usd?idr/usd:null};

   <div class="row" style="margin:14px 0 6px"><b>USD/IDR trend</b><span class="sp"></span><div class="pills">${[30,90,365].map(d=>`<button class="pill ${+bd('trendDays')===d?'on':''}" data-act="trenddays" data-d="${d}">${d===365?'1 year':d+' days'}</button>`).join('')}</div></div>${T.data?trendChart(T.data.pts):(T.err?`<div class="empty-mini">${esc(trunc(T.err.msg,140))}</div>`:'<div class="empty-mini">Loading…</div>')}

function cardHtml(name,mode,extra){const c=CARDS[name];return `<div class="card"><div class="ch"><h3>${c.title}</h3><span class="sp"></span>${extra||''}<button class="iconbtn" data-act="cardrefresh" data-card="${name}" aria-label="Refresh ${esc(c.title)}" title="Refresh">${ic('refresh',16)}</button></div><div data-cardbody="${name}" data-mode="${mode}">${c.render(mode)}</div></div>`}
function paintCard(name){document.querySelectorAll(`[data-cardbody="${name}"]`).forEach(el=>{el.innerHTML=CARDS[name].render(el.dataset.mode)})}
async function loadCard(name,mode,force){const deps=mode==='full'?CARDS[name].fullDeps:CARDS[name].deps;paintCard(name);await Promise.all(deps.map(id=>srcLoad(id,force).then(()=>paintCard(name))))}
function holCard(){const up=upcomingHolidays(5),he=holErrMsg();

    host.innerHTML='<div class="tradingview-widget-container__widget" style="height:100%"></div>';
    const s=document.createElement('script');s.src='https://s3.tradingview.com/external-embedding/'+t.js;s.async=true;s.textContent=JSON.stringify(t.cfg());
    s.onerror=()=>{host.innerHTML='<div class="empty-mini">TradingView could not be loaded (offline or blocked).</div>'};host.appendChild(s)})}

function statusRows(){
  const rows=[],st=id=>sst(id),mk=(id,name,group,endpoint,auth)=>{const s=st(id);rows.push({name,group,endpoint,auth,state:s.loading?'load':s.err?(s.data?'stale':'err'):s.data?'ok':'idle',msg:s.err&&s.err.msg,at:s.at,id})};
  rows.push({name:'Tuntas database',group:'Core',endpoint:getCfg().url.replace('https://',''),auth:'Publishable key (built-in)',state:DB.mode==='supabase'?'ok':'demo',msg:DB.mode==='supabase'?'':'Demo mode: data stays in this browser.',at:null});
  const y=new Date().getFullYear(),hs=S.hol[y],he=holErrMsg();rows.push({name:'Calendar Indonesia — holidays',group:'Calendar',endpoint:'use.apiindonesia.id/api/v1/libur?tahun='+y,auth:'Server secret “apiindonesia”',state:hs?'ok':he?'err':'idle',msg:he,at:hs?hs.at:null,hol:true});
  const p=prayerFor(todayS());rows.push({name:'Aladhan — prayer times',group:'Calendar',endpoint:'api.aladhan.com/v1/timings/{date}?method=20',auth:'No key',state:p?'ok':prayErr(todayS())?'err':'idle',msg:prayErr(todayS()),at:null,pray:true});
  Object.values(SRC).forEach(o=>mk(o.id,o.name,o.group,o.endpoint(),o.auth));

const BEACON_JS=String.raw`/*! Tuntas activity beacon for MatriXrade, v1
 *
 * Install: put this file next to the MatriXrade page and add a script tag with
 * src="marketaction-beacon.js" and the "defer" attribute just before the end of the body.
 * (Or paste the whole file inside an inline script tag.)
 *
 * What it does: every time you run an analysis ("Dapatkan rekomendasi" or "Hitung ...") it reports ONE short
 * activity to Tuntas: the section name, the ticker and a short excerpt of the result. Nothing else.
 * It makes no network requests. It only talks to
 *   - the Tuntas window that shows this page in a frame (the MatriXrade tab inside Tuntas), and
 *   - Tuntas tabs on the same website (same origin), which also receive activity done while Tuntas was closed.
 *
 * Optional settings: define window.TUNTAS_BEACON before this file loads, for example
 *   window.TUNTAS_BEACON = { trigger: /dapatkan rekomendasi|^hitung\b/i, target: 'https://your-tuntas.example' };
 */
(function () {
  'use strict';
  if (window.__tuntasBeacon) return;
  window.__tuntasBeacon = true;

  var cfg = window.TUNTAS_BEACON || {};
  var TRIGGER = cfg.trigger || /dapatkan rekomendasi|^hitung\b/i;
  var IDLE = /isi form lalu klik/i;
  var RESULT_HINT = /(hasil|result|output|rekomendasi|recommend)/i;

  function txt(el) { return (el && el.textContent || '').replace(/\s+/g, ' ').trim(); }
  function follows(a, b) { return !!(a.compareDocumentPosition(b) & 4); }   // b comes after a in the document

  // The section is the stretch of the page between one <h1> and the next <h1>.
  function sectionOf(btn) {
    var hs = [].slice.call(document.querySelectorAll('h1')), start = null, end = null, i;
    for (i = 0; i < hs.length; i++) { if (follows(hs[i], btn)) start = hs[i]; else if (start) { end = hs[i]; break; } }
    return { start: start, end: end };
  }
  function inSection(el, sec) {
    if (sec.start && !follows(sec.start, el)) return false;
    if (sec.end && follows(sec.end, el)) return false;
    return true;
  }
  function title(sec) {
    var t = sec.start ? txt(sec.start) : (document.title || 'MatriXrade');
    return t.replace(/^rekomendasi aksi\s+/i, '').replace(/^evaluasi (&|dan) rekomendasi\s+/i, '').replace(/^kalkulator\s+/i, 'Kalkulator ') || t;
  }
  function labelOf(inp) {
    var l = (inp.getAttribute('aria-label') || '') + ' ' + (inp.getAttribute('placeholder') || '') + ' ' + (inp.id || '') + ' ' + (inp.name || '');
    if (inp.labels && inp.labels.length) l += ' ' + txt(inp.labels[0]);
    var p = inp.previousElementSibling; if (p) l += ' ' + txt(p);
    return l;
  }
  function tickerOf(sec) {
    var inputs = [].slice.call(document.querySelectorAll('input')).filter(function (i) {
      return (!i.type || i.type === 'text' || i.type === 'search') && inSection(i, sec);
    });
    var hit = inputs.filter(function (i) { return /ticker|aset|reksadana|nama/i.test(labelOf(i)); })[0];
    var v = ((hit || inputs[0] || {}).value || '').trim();
    return v.toUpperCase().slice(0, 40);
  }
  function resultOf(sec, btn) {
    var cands = [].slice.call(document.querySelectorAll('div,section,article,p,pre,output')).filter(function (el) {
      if (!inSection(el, sec) || el.contains(btn) || el.querySelector('input,select,textarea,button')) return false;
      var t = txt(el);
      return t.length > 15 && !IDLE.test(t) && (RESULT_HINT.test((el.id || '') + ' ' + (el.className || '')) || follows(btn, el));
    });
    var pick = cands.filter(function (el) { return RESULT_HINT.test((el.id || '') + ' ' + (el.className || '')); }).pop() || cands[0];
    return pick ? txt(pick).slice(0, 500) : '';
  }

  function targetOrigin() {
    if (cfg.target) return cfg.target;
    var o = (location.ancestorOrigins && location.ancestorOrigins[0]) || '';
    if (!o && document.referrer) { try { o = new URL(document.referrer).origin; } catch (e) { o = ''; } }
    return (!o || o === 'null' || o.indexOf('file:') === 0) ? '*' : o;
  }
  function send(ev) {
    var msg = { type: 'tuntas-activity', v: 1, id: ev.id, ts: ev.ts, source: 'marketaction', section: ev.section, ticker: ev.ticker, detail: ev.detail, url: location.href };
    try { if (window.parent && window.parent !== window) window.parent.postMessage(msg, targetOrigin()); } catch (e) {}
    try { if (window.opener) window.opener.postMessage(msg, targetOrigin()); } catch (e) {}
    try { var bc = new BroadcastChannel('tuntas-activity'); bc.postMessage(msg); bc.close(); } catch (e) {}
    try {
      var q = JSON.parse(localStorage.getItem('tuntas.inbox') || '[]'); q.push(msg);
      localStorage.setItem('tuntas.inbox', JSON.stringify(q.slice(-100)));
    } catch (e) {}
  }

  document.addEventListener('click', function (e) {
    var b = e.target && e.target.closest && e.target.closest('button,input[type=button],input[type=submit],[role=button]');
    if (!b) return;
    var label = txt(b) || b.value || '';
    if (!TRIGGER.test(label)) return;
    var sec = sectionOf(b), id = 'ma-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);
    var report = function (final) {
      var detail = resultOf(sec, b);
      if (!detail && !final) return setTimeout(function () { report(true); }, 900);
      send({ id: id, ts: Date.now(), section: title(sec), ticker: tickerOf(sec), detail: detail });
    };
    setTimeout(function () { report(false); }, 600);
  }, true);
})();
`;

/* =====================================================================
   ACCESS CONTROL — SQL (enforced in the database, not only in the screens)
   admin = highest power · user = limited by per-user permissions
   permission levels per action (create / edit / delete):  allow · ask (needs admin approval) · deny
   ===================================================================== */
function accessSQLFunctions(){return `
-- =====================================================================
-- ACCESS CONTROL  (admin = highest power; users limited by permissions)
-- =====================================================================
alter table public.profiles add column if not exists status text not null default 'active';
alter table public.profiles add column if not exists perms jsonb not null default '{}'::jsonb;
alter table public.profiles drop constraint if exists profiles_status_chk;
alter table public.profiles add constraint profiles_status_chk check (status in ('active','pending','disabled'));
-- accounts that were switched off before this version keep being off
update public.profiles set status='disabled' where active=false and status='active';

create or replace function public.profiles_sync() returns trigger language plpgsql as $$
begin new.active := (new.status='active'); return new; end $$;
drop trigger if exists profiles_sync_trg on public.profiles;
create trigger profiles_sync_trg before insert or update on public.profiles
  for each row execute function public.profiles_sync();

create or replace function public.is_admin() returns boolean
language sql security definer stable set search_path=public as $$
  select exists(select 1 from public.profiles where id=auth.uid() and role='admin' and status='active') $$;
create or replace function public.is_active() returns boolean
language sql security definer stable set search_path=public as $$
  select exists(select 1 from public.profiles where id=auth.uid() and status='active') $$;
create or replace function public.my_perms() returns jsonb
language sql security definer stable set search_path=public as $$
  select coalesce((select perms from public.profiles where id=auth.uid() and status='active'),'{}'::jsonb) $$;

-- Permission presets (the app has the same list)
create or replace function public.preset_perms(p text) returns jsonb language sql immutable as $$
  select (case p
    when 'approval' then '{"create":"allow","edit":"ask","delete":"ask","export":true,"import":false,"integrations":false}'
    when 'entry'    then '{"create":"allow","edit":"deny","delete":"deny","export":true,"import":false,"integrations":false}'
    when 'viewer'   then '{"create":"deny","edit":"deny","delete":"deny","export":true,"import":false,"integrations":false}'
    else                 '{"create":"allow","edit":"allow","delete":"allow","export":true,"import":false,"integrations":false}'
  end)::jsonb $$;

-- Level of one action on one table for the signed-in user: allow | ask | deny
create or replace function public.perm_level(t text, act text) returns text
language plpgsql security definer stable set search_path=public as $$
declare p jsonb; v text;
begin
  if public.is_admin() then return 'allow'; end if;
  if not public.is_active() then return 'deny'; end if;
  p := public.my_perms();
  if t='api_connections' and coalesce((p->>'integrations')::boolean,false)=false then return 'deny'; end if;
  v := p->'tables'->t->>act;
  if v is null or v not in ('allow','ask','deny') then v := p->>act; end if;
  if v is null or v not in ('allow','ask','deny') then v := 'allow'; end if;
  return v;
end $$;

-- May the signed-in user READ rows owned by o?  Own rows, everything for admins, or users granted by an admin.
create or replace function public.can_read_owner(o uuid) returns boolean
language sql security definer stable set search_path=public as $$
  select (o=auth.uid() and public.is_active())
      or public.is_admin()
      or exists(select 1 from public.profiles p where p.id=auth.uid() and p.status='active'
                and (p.perms->'read_users' ? '*' or p.perms->'read_users' ? o::text)) $$;

-- Registration settings (one row) and a public view the sign-in screen can read
create table if not exists public.app_settings(
  key text primary key, value jsonb not null default '{}'::jsonb, updated_at timestamptz not null default now());
insert into public.app_settings(key,value) values('access','{"signup":"open","default_preset":"standard"}') on conflict (key) do nothing;
alter table public.app_settings enable row level security;
drop policy if exists app_settings_admin on public.app_settings;
create policy app_settings_admin on public.app_settings for all using (public.is_admin()) with check (public.is_admin());
create or replace view public.app_public as select value->>'signup' as signup from public.app_settings where key='access';
grant select on public.app_public to anon, authenticated;

-- New accounts: first one is admin; the rest follow the registration mode
create or replace function public.handle_new_user() returns trigger
language plpgsql security definer set search_path=public as $$
declare first boolean; mode text; preset text; st text;
begin
  first := not exists(select 1 from public.profiles);
  select coalesce(value->>'signup','open'), coalesce(value->>'default_preset','standard') into mode, preset
    from public.app_settings where key='access';
  mode := coalesce(mode,'open'); preset := coalesce(preset,'standard');
  st := case when first or mode='open' then 'active' else 'pending' end;
  insert into public.profiles(id,email,full_name,role,status,perms)
  values(new.id,new.email,
    coalesce(nullif(new.raw_user_meta_data->>'full_name',''),split_part(new.email,'@',1)),
    case when first then 'admin' else 'user' end, st,
    case when first then '{}'::jsonb else public.preset_perms(preset) end)
  on conflict (id) do nothing;
  return new;
end $$;
drop trigger if exists on_auth_user_created on auth.users;
create trigger on_auth_user_created after insert on auth.users
  for each row execute function public.handle_new_user();

-- Users can never change their own role, status or permissions
create or replace function public.profiles_guard() returns trigger
language plpgsql security definer set search_path=public as $$
begin
  if (new.role is distinct from old.role or new.active is distinct from old.active
      or new.status is distinct from old.status or new.perms is distinct from old.perms)
     and auth.uid() is not null and not public.is_admin() then
    raise exception 'Only an admin can change role, status or permissions';
  end if;
  return new;
end $$;
drop trigger if exists profiles_guard_trg on public.profiles;
create trigger profiles_guard_trg before update on public.profiles
  for each row execute function public.profiles_guard();
drop policy if exists profiles_sel on public.profiles;
create policy profiles_sel on public.profiles for select using (id=auth.uid() or public.is_admin() or public.can_read_owner(id));
drop policy if exists profiles_upd on public.profiles;
create policy profiles_upd on public.profiles for update using (id=auth.uid() or public.is_admin()) with check (id=auth.uid() or public.is_admin());

-- ---------- Change requests: what a user with "needs approval" sends to the admin ----------
create table if not exists public.change_requests(
  id uuid primary key default gen_random_uuid(),
  requester uuid not null default auth.uid() references auth.users(id) on delete cascade,
  tbl text not null check (tbl ~ '^[a-z_]+$'),
  row_id uuid,
  action text not null check (action in ('create','edit','delete')),
  payload jsonb not null default '{}'::jsonb,
  old_data jsonb,
  summary text,
  rev integer not null default 1,
  status text not null default 'pending' check (status in ('pending','approved','rejected','cancelled')),
  note text,
  decided_by uuid references auth.users(id) on delete set null,
  decided_at timestamptz,
  created_at timestamptz not null default now());
create index if not exists change_requests_req_idx on public.change_requests(requester, created_at desc);
create index if not exists change_requests_st_idx on public.change_requests(status, created_at desc);
alter table public.change_requests enable row level security;

create or replace function public.change_requests_check() returns trigger
language plpgsql security definer set search_path=public as $$
declare b jsonb;
begin
  if new.tbl='master_data' or not exists(select 1 from information_schema.columns
       where table_schema='public' and table_name=new.tbl and column_name='owner') then
    raise exception 'Requests are not possible for %', new.tbl;
  end if;
  if new.action in ('edit','delete') then
    if new.row_id is null then raise exception 'A record is required'; end if;
    execute format('select to_jsonb(t) from public.%I t where id=$1 and owner=$2', new.tbl) into b using new.row_id, new.requester;
    if b is null then raise exception 'You can only ask about your own records'; end if;
    new.old_data := b - 'auth_value';
  end if;
  new.status := 'pending'; new.decided_by := null; new.decided_at := null; new.note := null;
  return new;
end $$;
drop trigger if exists change_requests_check_trg on public.change_requests;
create trigger change_requests_check_trg before insert on public.change_requests
  for each row execute function public.change_requests_check();

drop policy if exists cr_sel on public.change_requests;
create policy cr_sel on public.change_requests for select using (requester=auth.uid() or public.is_admin());
drop policy if exists cr_ins on public.change_requests;
create policy cr_ins on public.change_requests for insert
  with check (requester=auth.uid() and public.is_active() and public.perm_level(tbl,action)='ask');
drop policy if exists cr_cancel on public.change_requests;
create policy cr_cancel on public.change_requests for update
  using (requester=auth.uid() and status='pending') with check (requester=auth.uid() and status='cancelled');
drop policy if exists cr_merge on public.change_requests;
create policy cr_merge on public.change_requests for update
  using (requester=auth.uid() and status='pending') with check (requester=auth.uid() and status in ('pending','cancelled'));

-- A requester may only cancel a request or add to its content; everything else is fixed once sent
create or replace function public.change_requests_guard() returns trigger
language plpgsql security definer set search_path=public as $$
begin
  new.rev := old.rev + 1;
  if auth.uid() is not null and not public.is_admin() then
    if new.requester is distinct from old.requester or new.tbl is distinct from old.tbl or new.row_id is distinct from old.row_id
       or new.action is distinct from old.action or new.old_data is distinct from old.old_data
       or new.decided_by is distinct from old.decided_by or new.decided_at is distinct from old.decided_at
       or new.note is distinct from old.note then
      raise exception 'A sent request cannot be changed, only cancelled';
    end if;
    if new.status is distinct from old.status and not (old.status='pending' and new.status='cancelled') then
      raise exception 'Only an admin can decide a request';
    end if;
  end if;
  return new;
end $$;
drop trigger if exists change_requests_guard_trg on public.change_requests;
create trigger change_requests_guard_trg before update on public.change_requests
  for each row execute function public.change_requests_guard();

create or replace function public.audit_admin(p_action text, p_target uuid, p_detail jsonb) returns void
language sql security definer set search_path=public as $$
  insert into public.audit_log(user_id,table_name,record_id,action,new_data) values(auth.uid(),'access',p_target,p_action,p_detail) $$;

create or replace function public.approve_change(p_id uuid, p_rev integer default null) returns void
language plpgsql security definer set search_path=public as $$
declare r public.change_requests; cols text; newid uuid; n int; pl jsonb;
begin
  if not public.is_admin() then raise exception 'Only an admin can approve requests'; end if;
  select * into r from public.change_requests where id=p_id for update;
  if not found then raise exception 'Request not found'; end if;
  if r.status<>'pending' then raise exception 'This request was already %', r.status; end if;
  if p_rev is not null and r.rev<>p_rev then raise exception 'This request changed after you opened it. Review it again.'; end if;
  if r.tbl='master_data' or not exists(select 1 from information_schema.columns
       where table_schema='public' and table_name=r.tbl and column_name='owner') then
    raise exception 'Not allowed for %', r.tbl;
  end if;
  if r.action='delete' then
    execute format('delete from public.%I where id=$1 and owner=$2', r.tbl) using r.row_id, r.requester;
    get diagnostics n = row_count;
    if n=0 then raise exception 'The record no longer exists'; end if;
  elsif r.action='edit' then
    select string_agg(format('%I=(jsonb_populate_record(null::public.%I,$3)).%I', c.column_name, r.tbl, c.column_name), ',')
      into cols from information_schema.columns c
      where c.table_schema='public' and c.table_name=r.tbl and r.payload ? c.column_name
        and c.column_name not in ('id','owner','created_at','updated_at');
    if cols is not null then
      execute format('update public.%I set %s where id=$1 and owner=$2', r.tbl, cols) using r.row_id, r.requester, r.payload;
      get diagnostics n = row_count;
      if n=0 then raise exception 'The record no longer exists'; end if;
    end if;
  else
    pl := (r.payload - 'owner' - 'created_at' - 'updated_at') || jsonb_build_object('owner', r.requester);
    select string_agg(format('%I', c.column_name), ',') into cols from information_schema.columns c
      where c.table_schema='public' and c.table_name=r.tbl and pl ? c.column_name;
    execute format('insert into public.%I (%s) select %s from jsonb_populate_record(null::public.%I,$1) returning id', r.tbl, cols, cols, r.tbl)
      into newid using pl;
  end if;
  update public.change_requests set status='approved', decided_by=auth.uid(), decided_at=now(), row_id=coalesce(newid,row_id) where id=p_id;
  perform public.audit_admin('APPROVE', r.requester, jsonb_build_object('request',p_id,'table',r.tbl,'action',r.action));
end $$;

create or replace function public.reject_change(p_id uuid, p_note text default null) returns void
language plpgsql security definer set search_path=public as $$
declare r public.change_requests;
begin
  if not public.is_admin() then raise exception 'Only an admin can reject requests'; end if;
  select * into r from public.change_requests where id=p_id for update;
  if not found then raise exception 'Request not found'; end if;
  if r.status<>'pending' then raise exception 'This request was already %', r.status; end if;
  update public.change_requests set status='rejected', note=nullif(p_note,''), decided_by=auth.uid(), decided_at=now() where id=p_id;
  perform public.audit_admin('REJECT', r.requester, jsonb_build_object('request',p_id,'table',r.tbl,'action',r.action));
end $$;

-- ---------- Admin: manage users ----------
create or replace function public.admin_other_admins(p_uid uuid) returns integer
language sql security definer stable set search_path=public as $$
  select count(*)::int from public.profiles where role='admin' and status='active' and id<>p_uid $$;

create or replace function public.admin_set_status(p_uid uuid, p_status text) returns void
language plpgsql security definer set search_path=public as $$
declare cur public.profiles;
begin
  if not public.is_admin() then raise exception 'Only an admin can do this'; end if;
  if p_status not in ('active','pending','disabled') then raise exception 'Unknown status'; end if;
  select * into cur from public.profiles where id=p_uid;
  if not found then raise exception 'User not found'; end if;
  if p_uid=auth.uid() and p_status<>'active' then raise exception 'You cannot switch off your own account'; end if;
  if cur.role='admin' and p_status<>'active' and public.admin_other_admins(p_uid)=0 then raise exception 'There must always be one active admin'; end if;
  update public.profiles set status=p_status where id=p_uid;
  update auth.users set banned_until = case when p_status='disabled' then 'infinity'::timestamptz else null end where id=p_uid;
  perform public.audit_admin('STATUS', p_uid, jsonb_build_object('status',p_status));
end $$;

create or replace function public.admin_set_role(p_uid uuid, p_role text) returns void
language plpgsql security definer set search_path=public as $$
declare cur public.profiles;
begin
  if not public.is_admin() then raise exception 'Only an admin can do this'; end if;
  if p_role not in ('admin','user') then raise exception 'Unknown role'; end if;
  select * into cur from public.profiles where id=p_uid;
  if not found then raise exception 'User not found'; end if;
  if cur.role='admin' and p_role<>'admin' and (p_uid=auth.uid() or public.admin_other_admins(p_uid)=0) then
    raise exception 'There must always be one active admin';
  end if;
  update public.profiles set role=p_role where id=p_uid;
  perform public.audit_admin('ROLE', p_uid, jsonb_build_object('role',p_role));
end $$;

create or replace function public.admin_set_perms(p_uid uuid, p_perms jsonb) returns void
language plpgsql security definer set search_path=public as $$
begin
  if not public.is_admin() then raise exception 'Only an admin can do this'; end if;
  if jsonb_typeof(p_perms)<>'object' then raise exception 'Permissions must be an object'; end if;
  update public.profiles set perms=p_perms where id=p_uid;
  if not found then raise exception 'User not found'; end if;
  perform public.audit_admin('PERMISSIONS', p_uid, p_perms);
end $$;

create or replace function public.admin_transfer_data(p_from uuid, p_to uuid) returns integer
language plpgsql security definer set search_path=public as $$
declare t text; n int; total int := 0;
begin
  if not public.is_admin() then raise exception 'Only an admin can do this'; end if;
  if p_from=p_to then raise exception 'Choose a different user'; end if;
  if not exists(select 1 from public.profiles where id=p_to and status='active') then raise exception 'The receiving user must be active'; end if;
  for t in select c.table_name from information_schema.columns c
      join information_schema.tables tb on tb.table_schema=c.table_schema and tb.table_name=c.table_name and tb.table_type='BASE TABLE'
      where c.table_schema='public' and c.column_name='owner' and c.table_name not in ('master_data')
  loop
    execute format('update public.%I set owner=$1 where owner=$2', t) using p_to, p_from;
    get diagnostics n = row_count; total := total + n;
  end loop;
  perform public.audit_admin('TRANSFER', p_from, jsonb_build_object('to',p_to,'rows',total));
  return total;
end $$;

create or replace function public.admin_delete_user(p_uid uuid, p_transfer_to uuid default null) returns void
language plpgsql security definer set search_path=public as $$
declare cur public.profiles;
begin
  if not public.is_admin() then raise exception 'Only an admin can do this'; end if;
  if p_uid=auth.uid() then raise exception 'You cannot delete your own account'; end if;
  select * into cur from public.profiles where id=p_uid;
  if not found then raise exception 'User not found'; end if;
  if cur.role='admin' and cur.status='active' and public.admin_other_admins(p_uid)=0 then raise exception 'There must always be one active admin'; end if;
  if p_transfer_to is not null then perform public.admin_transfer_data(p_uid, p_transfer_to); end if;
  perform public.audit_admin('DELETE_USER', p_uid, jsonb_build_object('email',cur.email,'transferred_to',p_transfer_to));
  delete from auth.users where id=p_uid;
end $$;

create or replace function public.admin_set_signup(p_mode text, p_preset text default 'standard') returns void
language plpgsql security definer set search_path=public as $$
begin
  if not public.is_admin() then raise exception 'Only an admin can do this'; end if;
  if p_mode not in ('open','approval','closed') then raise exception 'Unknown mode'; end if;
  if p_preset not in ('standard','approval','entry','viewer') then raise exception 'Unknown preset'; end if;
  insert into public.app_settings(key,value) values('access', jsonb_build_object('signup',p_mode,'default_preset',p_preset))
    on conflict (key) do update set value=excluded.value, updated_at=now();
  perform public.audit_admin('SIGNUP_MODE', null, jsonb_build_object('signup',p_mode,'default_preset',p_preset));
end $$;

revoke all on function public.approve_change(uuid,integer), public.reject_change(uuid,text), public.admin_set_status(uuid,text),
  public.admin_set_role(uuid,text), public.admin_set_perms(uuid,jsonb), public.admin_transfer_data(uuid,uuid),
  public.admin_delete_user(uuid,uuid), public.admin_set_signup(text,text) from public, anon;
grant execute on function public.approve_change(uuid,integer), public.reject_change(uuid,text), public.admin_set_status(uuid,text),
  public.admin_set_role(uuid,text), public.admin_set_perms(uuid,jsonb), public.admin_transfer_data(uuid,uuid),
  public.admin_delete_user(uuid,uuid), public.admin_set_signup(text,text) to authenticated;
`}

/* =====================================================================
   AI (OpenAI) — SQL: who may use it, how much, and a record of every use.
   The OpenAI key lives only in the Edge Function. These functions decide and count.
   ===================================================================== */
function aiSQLFunctions(){return `
-- =====================================================================
-- AI DRAFTS: settings, permission, daily limit and usage record
-- =====================================================================
insert into public.app_settings(key,value) values('ai',
  '{"enabled":false,"daily_limit":10,"model":"","tz":"Asia/Jakarta","exclude_areas":["Trading","Investment"],"calendar_titles":false}')
  on conflict (key) do nothing;

create table if not exists public.ai_usage(
  id uuid primary key default gen_random_uuid(),
  user_id uuid not null references auth.users(id) on delete cascade,
  feature text not null check (feature ~ '^[a-z_]{1,40}$'),
  model text,
  status text not null default 'pending' check (status in ('pending','ok','error')),
  tokens_in integer,
  tokens_out integer,
  created_at timestamptz not null default now());
create index if not exists ai_usage_user_idx on public.ai_usage(user_id, created_at desc);
alter table public.ai_usage enable row level security;
drop policy if exists ai_usage_sel on public.ai_usage;
create policy ai_usage_sel on public.ai_usage for select using (user_id=auth.uid() or public.is_admin());

create or replace function public.ai_cfg() returns jsonb
language sql security definer stable set search_path=public as $$
  select '{"enabled":false,"daily_limit":10,"model":"","tz":"Asia/Jakarta","exclude_areas":["Trading","Investment"],"calendar_titles":false}'::jsonb
         || coalesce((select value from public.app_settings where key='ai'),'{}'::jsonb) $$;

create or replace function public.ai_day_start() returns timestamptz
language sql stable as $$
  select date_trunc('day', now() at time zone (public.ai_cfg()->>'tz')) at time zone (public.ai_cfg()->>'tz') $$;

create or replace function public.ai_used_today(p_uid uuid) returns integer
language sql security definer stable set search_path=public as $$
  select count(*)::int from public.ai_usage where user_id=p_uid and created_at>=public.ai_day_start() $$;

create or replace function public.ai_allowed() returns boolean
language sql security definer stable set search_path=public as $$
  select public.is_active() and (public.is_admin() or coalesce((public.my_perms()->>'ai')::boolean,false)) $$;

-- What the screens may know (never the usage of other people, never any key)
create or replace function public.ai_status() returns jsonb
language plpgsql security definer stable set search_path=public as $$
declare c jsonb; used int;
begin
  c := public.ai_cfg();
  if not public.is_active() then return jsonb_build_object('allowed',false,'reason','not_active'); end if;
  used := public.ai_used_today(auth.uid());
  return jsonb_build_object(
    'allowed', public.ai_allowed() and (c->>'enabled')::boolean,
    'reason', case when not (c->>'enabled')::boolean then 'disabled' when not public.ai_allowed() then 'not_allowed'
                   when coalesce(c->>'model','')='' then 'no_model' when used>=(c->>'daily_limit')::int then 'limit' else 'ok' end,
    'used', used, 'limit', (c->>'daily_limit')::int,
    'model_set', coalesce(c->>'model','')<>'',
    'exclude_areas', c->'exclude_areas', 'calendar_titles', coalesce((c->>'calendar_titles')::boolean,false));
end $$;

-- One call = one row, counted at once (so errors and retries count too). The check and the insert are atomic per person.
create or replace function public.ai_reserve(p_feature text) returns jsonb
language plpgsql security definer set search_path=public as $$
declare c jsonb; used int; lim int; rid uuid;
begin
  if auth.uid() is null or not public.is_active() then return jsonb_build_object('ok',false,'reason','not_active'); end if;
  c := public.ai_cfg(); lim := (c->>'daily_limit')::int;
  if not (c->>'enabled')::boolean then return jsonb_build_object('ok',false,'reason','disabled'); end if;
  if not public.ai_allowed() then return jsonb_build_object('ok',false,'reason','not_allowed'); end if;
  if coalesce(c->>'model','')='' then return jsonb_build_object('ok',false,'reason','no_model'); end if;
  if p_feature is null or p_feature !~ '^[a-z_]{1,40}$' then return jsonb_build_object('ok',false,'reason','bad_feature'); end if;
  perform pg_advisory_xact_lock(hashtext(auth.uid()::text));
  used := public.ai_used_today(auth.uid());
  if used>=lim then return jsonb_build_object('ok',false,'reason','limit','used',used,'limit',lim); end if;
  insert into public.ai_usage(user_id,feature,model) values(auth.uid(),p_feature,c->>'model') returning id into rid;
  return jsonb_build_object('ok',true,'id',rid,'model',c->>'model','used',used+1,'limit',lim,
    'exclude_areas', c->'exclude_areas', 'calendar_titles', coalesce((c->>'calendar_titles')::boolean,false));
end $$;

-- Records the outcome. Only the owner, only while pending: it cannot be used to take a call back.
create or replace function public.ai_finish(p_id uuid, p_status text, p_in integer, p_out integer) returns void
language sql security definer set search_path=public as $$
  update public.ai_usage set status=case when p_status='ok' then 'ok' else 'error' end,
         tokens_in=least(greatest(coalesce(p_in,0),0),10000000), tokens_out=least(greatest(coalesce(p_out,0),0),10000000)
   where id=p_id and user_id=auth.uid() and status='pending' $$;

create or replace function public.ai_admin_set(p_cfg jsonb) returns void
language plpgsql security definer set search_path=public as $$
declare cur jsonb; nw jsonb; lim int; mdl text; tzn text; ex jsonb;
begin
  if not public.is_admin() then raise exception 'Only an admin can do this'; end if;
  if jsonb_typeof(p_cfg)<>'object' then raise exception 'Settings must be an object'; end if;
  cur := public.ai_cfg(); nw := cur;
  if p_cfg ? 'enabled' then
    if jsonb_typeof(p_cfg->'enabled')<>'boolean' then raise exception 'enabled must be true or false'; end if;
    nw := nw || jsonb_build_object('enabled', p_cfg->'enabled'); end if;
  if p_cfg ? 'daily_limit' then
    lim := (p_cfg->>'daily_limit')::int;
    if lim<0 or lim>500 then raise exception 'The daily limit must be between 0 and 500'; end if;
    nw := nw || jsonb_build_object('daily_limit', lim); end if;
  if p_cfg ? 'model' then
    mdl := coalesce(p_cfg->>'model','');
    if mdl !~ '^[A-Za-z0-9._:/-]{0,100}$' then raise exception 'That is not a valid model name'; end if;
    nw := nw || jsonb_build_object('model', mdl); end if;
  if p_cfg ? 'tz' then
    tzn := p_cfg->>'tz';
    if not exists(select 1 from pg_timezone_names where name=tzn) then raise exception 'Unknown time zone'; end if;
    nw := nw || jsonb_build_object('tz', tzn); end if;
  if p_cfg ? 'exclude_areas' then
    ex := p_cfg->'exclude_areas';
    if jsonb_typeof(ex)<>'array' or jsonb_array_length(ex)>20 then raise exception 'List up to 20 life areas'; end if;
    if exists(select 1 from jsonb_array_elements(ex) e where jsonb_typeof(e)<>'string' or length(e#>>'{}')>60) then raise exception 'Life area names must be short text'; end if;
    nw := nw || jsonb_build_object('exclude_areas', ex); end if;
  if p_cfg ? 'calendar_titles' then
    if jsonb_typeof(p_cfg->'calendar_titles')<>'boolean' then raise exception 'calendar_titles must be true or false'; end if;
    nw := nw || jsonb_build_object('calendar_titles', p_cfg->'calendar_titles'); end if;
  insert into public.app_settings(key,value) values('ai',nw) on conflict (key) do update set value=excluded.value, updated_at=now();
  perform public.audit_admin('AI_SETTINGS', null, nw);
end $$;

create or replace function public.ai_admin_usage(p_days integer default 7) returns jsonb
language plpgsql security definer stable set search_path=public as $$
begin
  if not public.is_admin() then raise exception 'Only an admin can do this'; end if;
  return coalesce((select jsonb_agg(r order by r->>'last' desc) from (
    select jsonb_build_object('user_id',u.user_id,'name',coalesce(p.full_name,p.email,'(deleted)'),'feature',u.feature,
      'calls',count(*),'ok',count(*) filter (where u.status='ok'),'errors',count(*) filter (where u.status='error'),
      'tokens_in',coalesce(sum(u.tokens_in),0),'tokens_out',coalesce(sum(u.tokens_out),0),'last',max(u.created_at),
      'today',count(*) filter (where u.created_at>=public.ai_day_start())) r
    from public.ai_usage u left join public.profiles p on p.id=u.user_id
    where u.created_at>=now()-make_interval(days=>greatest(1,least(coalesce(p_days,7),90)))
    group by u.user_id,p.full_name,p.email,u.feature) t),'[]'::jsonb);
end $$;

revoke all on function public.ai_status(), public.ai_reserve(text), public.ai_finish(uuid,text,integer,integer),
  public.ai_admin_set(jsonb), public.ai_admin_usage(integer) from public, anon;
grant execute on function public.ai_status(), public.ai_reserve(text), public.ai_finish(uuid,text,integer,integer),
  public.ai_admin_set(jsonb), public.ai_admin_usage(integer) to authenticated;
`}

/* =====================================================================
   FOCUS — filter KPI, performance, plan-vs-actual, reviews and the dashboard
   by Life Area ("All", one life area, or items without a life area)
   ===================================================================== */
const FOCUS_TC={Exercise:'Health',Ibadah:'Ibadah',Family:'Family',Learning:'Learning',Work:'Work',Hobby:'Hobby'};
function focusId(){const f=prefs().focus;return f==='all'||f==='none'||(f&&byId('portfolios',f))?f:'all'}
/* which life area does a record belong to? (direct field, or through its project / activity / goal) */
function areaOf(table,r){
  const via=(t,id)=>{const x=id&&byId(t,id);return x?areaOf(t,x):null};
  switch(table){
    case 'activities':return r.portfolio_id||via('projects',r.project_id)||via('goals',r.goal_id)||null;
    case 'kpis':case 'plans':return r.portfolio_id||via('goals',r.goal_id)||null;
    case 'goals':return r.portfolio_id||via('goals',r.parent_id)||null;
    case 'milestones':return via('projects',r.project_id);
    case 'risks':case 'meetings':return via('projects',r.project_id);
    case 'meeting_actions':return via('meetings',r.meeting_id);
    case 'daily_actions':{const a=via('activities',r.activity_id);if(a)return a;const nm=FOCUS_TC[r.time_cat],p=nm&&(D().portfolios||[]).find(x=>x.name.toLowerCase()===nm.toLowerCase());return p?p.id:null}
    default:return r.portfolio_id||null}}
const inFocus=(table,r)=>{const f=focusId();return f==='all'||(f==='none'?!areaOf(table,r):areaOf(table,r)===f)};
const FD=table=>{const rows=D()[table]||[];return focusId()==='all'?rows:rows.filter(r=>inFocus(table,r))};
const focusName=()=>{const f=focusId();return f==='all'?'All life areas':f==='none'?'No life area':String(refLabel('portfolios',f)).trim()};
function focusBar(note){
  const f=focusId(),ps=(D().portfolios||[]).slice().sort((a,b)=>num(a.sort_order)-num(b.sort_order)||a.name.localeCompare(b.name));
  return `<div class="toolbar noprint focusbar" style="margin-bottom:14px"><label class="sm b" for="focus-sel">Life area</label><select class="in" id="focus-sel" style="min-width:210px" data-change="focus"><option value="all" ${f==='all'?'selected':''}>All life areas</option>${ps.map(p=>`<option value="${p.id}" ${f===p.id?'selected':''}>${esc((p.icon||'')+' '+p.name)}</option>`).join('')}<option value="none" ${f==='none'?'selected':''}>No life area</option></select>${f!=='all'?`<span class="badge b-blue">Showing ${esc(focusName())} only</span><button class="btn s t" data-act="focusall">Show all</button>`:''}${note?`<span class="sm mut">${note}</span>`:''}</div>`}
CHG.focus=async el=>{await setPrefs({focus:el.value});renderView()};
ACT.focusall=async()=>{await setPrefs({focus:'all'});renderView()};

  const types=[];[...quotas.map(q=>q.leave_type),...ent.map(l=>l.leave_type)].forEach(t=>{if(!types.includes(t))types.push(t)});
  const ord=t=>{const i=opts('leaveType').indexOf(t);return i<0?99:i};types.sort((a,b)=>ord(a)-ord(b));
  return types.map(t=>{
    const q=quotas.find(x=>x.leave_type===t);let used=0,planned=0,viaJoint=0;
    ent.forEach(l=>{const own=l.leave_type===t,ded=t===LV_ANNUAL&&l.deduct_annual&&l.leave_type!==LV_ANNUAL;if(!own&&!ded)return;

 validate(d){if(!num(d.hours))return 'Enter the hours (a number other than zero).';if(Math.abs(num(d.hours))>1000)return 'That is too many hours for one entry.';return ''},
 async after(row,old){

/* keep the activity total = hours before the log + logged sessions */
async function rebalance(aid,delta){
  const a=byId('activities',aid);if(!a||!delta||canDo('activities','edit')!=='allow')return;
  const logs=sumLogs(aid),base=a.base_hours!=null?num(a.base_hours):r2(num(a.actual_hours)-(logs-delta));
  const row=await DB.update('activities',aid,{base_hours:r2(base),actual_hours:Math.max(0,r2(base+logs))});replaceRow('activities',row)}

const isDoneish=s=>s==='Completed'||s==='Cancelled';
const _ab=MOD.activities.before;

  if(o){if(d.actual_hours!=null&&num(d.actual_hours)!==num(o.actual_hours))d.base_hours=r2(num(d.actual_hours)-sumLogs(o.id))}
  else if(d.actual_hours!=null)d.base_hours=num(d.actual_hours);
  if(o&&isDoneish(o.status)&&d.status&&!isDoneish(d.status)){d.reopened_at=nowISO();d.reopen_count=num(o.reopen_count)+1;d.reopen_open=true;if(num(d.progress)>=100)d.progress=90}

      const rule=parseRule(val(pr,'RRULE')),ex=new Set();
      (pr.EXDATE||[]).forEach(p=>String(p.value).split(',').forEach(x=>{const d=icsDt({value:x,params:p.params},vtz);if(d)ex.add(d.allDay?d.date:d.ms)}));
      const limit=dnOf(...(()=>{const f=fromDn(Math.floor(winEnd/864e5)+2);return [f.y,f.mo,f.d]})());

  const seen=new Set();return out.filter(e=>{if(seen.has(e.id))return false;seen.add(e.id);return true})}

const icsCfg=()=>Object.assign({on:true,import:false,busyOnly:true,privateAsBusy:true,past:7,ahead:60,server:false},prefs().cal||{});
const icsKey=()=>'feed:outlook:'+(DB.user?DB.user.id:'anon');

function normIcs(u){u=String(u||'').trim();if(!/^https:\/\//i.test(u))return '';return u.replace(/\/calendar\.html(\?.*)?$/i,'/calendar.ics$1')}
function icsRestore(){
  if(S.ics.restored)return;S.ics.restored=true;
  try{const c=JSON.parse(store.get(icsCacheKey())||'null');if(c&&Array.isArray(c.events)){S.ics.events=c.events;S.ics.at=c.at||0;S.ics.total=c.total||0}}catch(e){}}
async function icsFetchText(){
  const link=icsLink();let why='';
  if(DB.mode==='supabase'){try{return await proxyCall({url:ICS_HOST,method:'GET',headers:{Accept:'text/calendar, text/plain, */*'},secretName:'outlook'})}catch(e){why=e.message}}
  if(!link)throw new Error('No calendar link is set'+(why&&!/No server-side secret/.test(why)?'. '+why:'')+'. Add it under Settings → Calendars.');

async function icsSync(force){
  icsRestore();const c=icsCfg(),I=S.ics;
  if(!c.on||!icsConfigured())return false;if(I.loading)return I.loading;
  if(!force&&I.at&&Date.now()-I.at<30*60e3&&!I.err)return false;if(!force&&I.err&&Date.now()-I.err.at<120e3)return false;
  I.loading=(async()=>{

      const text=await icsFetchText();
      if(!/BEGIN:VCALENDAR/i.test(text))throw new Error('The link did not return a calendar. Check that the calendar is still published (Outlook on the web → Settings → Calendar → Shared calendars → Publish a calendar) and that the link ends in .ics.');
      const parsed=icsParse(text),ws=pd(addD(todayS(),-c.past)).getTime(),we=pd(addD(todayS(),c.ahead+1)).getTime();

function icsBusyMin(d){

async function autoOutlook(){
  const c=icsCfg();await icsSync(false);const I=S.ics;if(I.err||!I.events.length&&!I.at)return 0;
  const t=todayS(),lo=addD(t,-c.past),now=Date.now(),seen=new Set(prefs().icsSeen||[]);
  const mine=(D().meetings||[]).filter(m=>String(m.ext_key||'').indexOf('auto:ics:')===0),byKey=new Map(mine.map(m=>[m.ext_key,m]));
  const evs=I.events.filter(e=>!e.allDay&&!e.cancelled&&e.sd>=lo&&(!c.busyOnly||e.busy!=='FREE')),live=new Set(evs.map(icsMeetKey)),rows=[],newSeen=[];let changed=0;
  for(const e of evs){
    const key=icsMeetKey(e),m=byKey.get(key);
    if(!m){if(seen.has(key))continue;newSeen.push(key);
      rows.push({title:e.title.slice(0,160),meeting_date:e.sd,start_time:e.st,end_time:e.et,type:'Outlook',status:e.endMs<now?'Held':'Planned',location:e.loc||null,attendees:[e.org?'Organizer: '+e.org:'',e.nAtt?(e.nAtt+' attendee'+(e.nAtt>1?'s':'')):''].filter(Boolean).join(' · ')||null,agenda:e.desc||null,ext_key:key});continue}
    const patch={};if(m.title!==e.title.slice(0,160))patch.title=e.title.slice(0,160);if(m.meeting_date!==e.sd)patch.meeting_date=e.sd;if(tm(m.start_time)!==e.st)patch.start_time=e.st;if(tm(m.end_time)!==e.et)patch.end_time=e.et;if((m.location||'')!==(e.loc||''))patch.location=e.loc||null;
    if(m.status==='Planned'&&e.endMs<now)patch.status='Held';
    if(Object.keys(patch).length&&canDo('meetings','edit')==='allow'){const r=await DB.update('meetings',m.id,patch);replaceRow('meetings',r);changed++}}
  /* removed or cancelled in Outlook → mark the future, still-planned meeting as cancelled */
  for(const m of mine){if(canDo('meetings','edit')==='allow'&&m.status==='Planned'&&m.meeting_date>=t&&!live.has(m.ext_key)&&m.meeting_date<=addD(t,c.ahead-1)){const r=await DB.update('meetings',m.id,{status:'Cancelled'});replaceRow('meetings',r);changed++}}
  if(rows.length){const ins=await DB.insertMany('meetings',rows);D().meetings=(D().meetings||[]).concat(ins)}
  if(newSeen.length)await setPrefs({icsSeen:[...(prefs().icsSeen||[]),...newSeen].slice(-2000)});
  return rows.length+changed}

function workCfg(){

  ['start','lunchStart','lunchEnd','end'].forEach(k=>{if(!HM_RE.test(String(c[k])))c[k]=d[k]});
  if(!(mins(c.start)<mins(c.lunchStart)&&mins(c.lunchStart)<mins(c.lunchEnd)&&mins(c.lunchEnd)<mins(c.end))){c.start=d.start;c.lunchStart=d.lunchStart;c.lunchEnd=d.lunchEnd;c.end=d.end}
  c.breakMin=clamp(Math.round(+c.breakMin)||15,5,45);c.days=(Array.isArray(c.days)?c.days:d.days).filter(x=>Number.isInteger(x)&&x>=0&&x<=6);if(!c.days.length)c.days=d.days;
  c.ahead=[1,3,5,7].includes(+c.ahead)?+c.ahead:5;c.breaks=c.breaks!==false;return c}
function workSlots(){
  const c=workCfg(),s=mins(c.start),ls=mins(c.lunchStart),le=mins(c.lunchEnd),e=mins(c.end),L=c.breakMin,m1=Math.round((s+ls)/2/5)*5,m2=Math.round((le+e)/2/5)*5;

/* ---------- the two daily breaks ---------- */
async function autoBreaks(){
  const c=workCfg();if(!c.breaks)return 0;
  const sl=workSlots(),seen=seenSet(),t=todayS(),rows=[],keys=[],yrs=new Set();
  for(let i=0;i<c.ahead;i++)yrs.add(+addD(t,i).slice(0,4));
  try{await ensureHolidays([...yrs])}catch(e){}
  for(let i=0;i<c.ahead;i++){
    const d=addD(t,i);if(!isWorkDay(d)||seen.has('brk:'+d))continue;
    if(holidayOn(d).some(h=>!h.joint))continue;
    if(typeof leavesOn==='function'&&leavesOn(d).some(l=>!l.half_day))continue;
    keys.push('brk:'+d);
    if((D().daily_actions||[]).filter(x=>x.action_date===d&&x.time_cat==='Break').length>=2)continue;
    [['am',sl.b1,'Break (morning)'],['pm',sl.b2,'Break (afternoon)']].forEach(([k,b,title])=>{
      if((D().daily_actions||[]).some(x=>x.ext_key==='auto:brk:'+d+':'+k))return;
      rows.push({action_date:d,title,time_cat:'Break',priority:'Low',start_time:hhmm(b[0]),end_time:hhmm(b[1]),planned_min:sl.L,status:'Not Started',progress:0,pomodoros:0,ext_key:'auto:brk:'+d+':'+k})})}
  if(rows.length){const ins=await DB.insertMany('daily_actions',rows);D().daily_actions=(D().daily_actions||[]).concat(ins)}
  await seenAdd(keys);return rows.length}

function wgAuto(){

/* =====================================================================
   EDGE FUNCTION CHECK + FILL IN KEYS WITH A TEXT FILE
   "Failed to send a request to the Edge Function" almost always means api-proxy is not
   deployed in this Supabase project (Supabase answers a missing function with a 404 that
   has no CORS headers, so the browser only sees a generic failure). This page says exactly
   what is wrong and walks through the fix, with a plain text file for the keys.
   ===================================================================== */
const EDGE_FEATURES=[
  ['apiindonesia','Indonesian public holidays (Calendar Indonesia)','APIINDONESIA_KEY'],
  ['gnews','News on the Market Board (GNews)','GNEWS_KEY'],
  ['tradingeconomics','Economic calendar (Trading Economics)','TRADINGECONOMICS_KEY'],
  ['outlook','Outlook calendar link kept on the server','OUTLOOK_ICS_URL'],
  ['openai','AI drafts (OpenAI key)','OPENAI_API_KEY']];
const edgeHost=u=>{try{return new URL(u).hostname}catch(e){return ''}};
const edgeRef=()=>edgeHost(getCfg().url).split('.')[0];
function edgeFix(msg){return /Edge Function/i.test(String(msg||''))?`<button class="btn s" data-act="go" data-p="settings" data-s="feeds" style="margin-top:8px">${ic('alert',14)} Check the Edge Function</button>`:''}

/* ---------- the check ---------- */
async function edgeReach(url){
  try{await fetch(url.replace(/\/$/,'')+'/functions/v1/api-proxy',{method:'GET',mode:'no-cors',cache:'no-store'});return true}catch(e){return false}}
async function edgeClassify(error){
  const nm=(error&&error.name)||'',st=error&&error.context&&error.context.status;let body=null;
  try{if(error&&error.context&&error.context.json)body=await error.context.json()}catch(e){}
  if(nm==='FunctionsFetchError'||nm==='FunctionsRelayError')return {kind:(await edgeReach(getCfg().url))?'blocked':'offline'};
  if(st===404)return {kind:'blocked'};
  if(st===401||st===403)return {kind:'auth',msg:body&&(body.error||body.message)};
  const m=body&&(body.error||body.message)||error.message||'';
  if(st===500&&/Invalid URL/i.test(m))return {kind:'old'};
  if(body&&/BOOT_ERROR|failed to start/i.test(String(body.code||'')+m))return {kind:'boot',msg:m};
  return {kind:'http',status:st,msg:m}}
async function edgeCheck(){
  S.edge={state:'run',at:Date.now()};
  const ref=edgeRef(),host=edgeHost(getCfg().url);
  if(DB.mode!=='supabase'){S.edge={state:'na',at:Date.now(),title:'Needs a Supabase database',body:['The Edge Function lives in your Supabase project, so it is only used when Tuntas is connected to Supabase (Settings → Database). In demo mode, keys can only be kept on this device.'],next:[]};return S.edge}
  let data=null,fail=null;
  try{const r=await DB.sb.functions.invoke('api-proxy',{body:{ping:true}});if(r.error)throw r.error;data=r.data}catch(e){fail=await edgeClassify(e)}
  if(!fail&&!(data&&data.ok))fail={kind:'old'};
  const dash=`https://supabase.com/dashboard/project/${ref}/functions`;
  if(!fail){
    const names=(data.secrets||[]).map(s=>s.name);
    S.edge={state:'ok',at:Date.now(),names,ver:data.version,title:'Working',body:[`The function api-proxy answers in project ${ref} (version ${data.version||'?'}).`],next:[]};return S.edge}
  const T={
    blocked:{title:'api-proxy is not deployed in this project (most likely)',body:[`Supabase at ${host} answered, but the browser was not allowed to read the answer. This is exactly what happens when the function does not exist: Supabase replies 404 without the headers a browser needs, and the app only sees “Failed to send a request to the Edge Function”.`,`Open Dashboard → Edge Functions for project ${ref}. A function named exactly api-proxy must be listed. If it is not, deploy it with the steps below. If it is listed, open it, press Test, and deploy the latest file again.`]},
    offline:{title:`Cannot reach ${host} at all`,body:['The browser could not contact Supabase. Check your internet connection, a VPN, a firewall, or an ad-blocker or privacy extension that blocks supabase.co, then try again.']},
    auth:{title:'The function refused your sign-in',body:['The function is there, but it did not accept your session. Sign out and sign in again. If it keeps happening, deploy the latest file again (it checks your session itself).'].concat(fail.msg?['Answer: '+fail.msg]:[])},
    old:{title:'api-proxy is deployed, but it is an older version',body:['The function answers, but it does not know the health check, so it is an older file. Deploy the latest file again (the download button below) and check again.']},
    boot:{title:'api-proxy failed to start',body:['The function exists but crashed while starting. Deploy the latest file again. If it still fails, open Dashboard → Edge Functions → api-proxy → Logs for the reason.'].concat(fail.msg?['Answer: '+fail.msg]:[])},
    http:{title:'api-proxy answered with an error',body:[`HTTP ${fail.status||'?'}${fail.msg?': '+fail.msg:''}`,'Deploy the latest file again and check once more.']}}[fail.kind]||{title:'Unknown problem',body:[String(fail.msg||'')]};
  S.edge={state:'bad',kind:fail.kind,at:Date.now(),title:T.title,body:T.body,dash,next:[]};return S.edge}

/* =====================================================================
   DEPLOY KIT — one zip with the function, the key template and a double-click script
   ===================================================================== */
function crc32(u8){let crc=-1;for(let i=0;i<u8.length;i++){let c=(crc^u8[i])&255;for(let k=0;k<8;k++)c=c&1?(c>>>1)^0xEDB88320:c>>>1;crc=(crc>>>8)^c}return (crc^-1)>>>0}
function makeZip(files){
  const enc=new TextEncoder(),parts=[],cen=[],d=new Date();let off=0;
  const dt=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),dd=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  files.forEach(f=>{
    const nm=enc.encode(f.name),data=typeof f.text==='string'?enc.encode(f.text):f.data,crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(10,dt,true);lh.setUint16(12,dd,true);lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,nm.length,true);
    parts.push(new Uint8Array(lh.buffer),nm,data);
    const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,(3<<8)|20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(12,dt,true);ch.setUint16(14,dd,true);ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);ch.setUint16(28,nm.length,true);ch.setUint32(38,((f.mode||0o100644)<<16)>>>0,true);ch.setUint32(42,off,true);
    cen.push(new Uint8Array(ch.buffer),nm);off+=30+nm.length+data.length});
  const cenLen=cen.reduce((a,b)=>a+b.length,0),e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cenLen,true);e.setUint32(16,off,true);
  const all=parts.concat(cen,[new Uint8Array(e.buffer)]),out=new Uint8Array(all.reduce((a,b)=>a+b.length,0));let p=0;all.forEach(b=>{out.set(b,p);p+=b.length});return out}

/* =====================================================================
   ACCESS CONTROL — client side
   The database enforces everything (see the SQL). The screens mirror the same rules
   so people never see buttons that cannot work, and requests flow to the admin.
   ===================================================================== */
const LEVELS=[['allow','Allowed'],['ask','Needs admin approval'],['deny','Not allowed']];
const LV_VALID=v=>v==='allow'||v==='ask'||v==='deny';
const PRESETS={
  standard:{label:'Standard user',help:'Full control of their own records. Cannot see other users or API settings.',perms:{create:'allow',edit:'allow',delete:'allow',export:true,import:false,integrations:false}},
  approval:{label:'Changes need approval',help:'Can add records. Editing or deleting waits until an admin approves.',perms:{create:'allow',edit:'ask',delete:'ask',export:true,import:false,integrations:false}},
  entry:{label:'Entry only',help:'Can add records but cannot change or delete what was entered.',perms:{create:'allow',edit:'deny',delete:'deny',export:true,import:false,integrations:false}},
  viewer:{label:'View only',help:'Can read their own data but cannot add, change or delete anything.',perms:{create:'deny',edit:'deny',delete:'deny',export:true,import:false,integrations:false}}};
function normPerms(p){
  p=p&&typeof p==='object'&&!Array.isArray(p)?p:{};
  const tables={};if(p.tables&&typeof p.tables==='object')Object.keys(p.tables).forEach(t=>{const o=p.tables[t];if(!o||typeof o!=='object')return;const x={};['create','edit','delete'].forEach(a=>{if(LV_VALID(o[a]))x[a]=o[a]});if(Object.keys(x).length)tables[t]=x});
  const ru=Array.isArray(p.read_users)?p.read_users.map(String).filter(Boolean):[];
  return {create:LV_VALID(p.create)?p.create:'allow',edit:LV_VALID(p.edit)?p.edit:'allow',delete:LV_VALID(p.delete)?p.delete:'allow',tables,read_users:ru,export:p.export!==false,import:p.import===true,integrations:p.integrations===true,ai:p.ai===true}}
const profStatus=p=>(p&&p.status)||(p&&p.active===false?'disabled':'active');
function presetOf(perms){
  const x=normPerms(perms);if(Object.keys(x.tables).length||x.read_users.length)return 'custom';
  const k=Object.keys(PRESETS).find(n=>{const q=PRESETS[n].perms;return q.create===x.create&&q.edit===x.edit&&q.delete===x.delete&&q.export===x.export&&q.import===x.import&&q.integrations===x.integrations});
  return k||'custom'}
/* what is this person allowed to do with a record of this module?  allow | ask | deny */
function canDo(table,act,prof){
  const p=prof||S.profile;if(!p)return 'deny';
  const st=profStatus(p);if(st!=='active')return 'deny';
  if(p.role==='admin')return 'allow';
  if(table==='master_data')return 'deny';
  const x=normPerms(p.perms);if(table==='api_connections'&&!x.integrations)return 'deny';
  const tv=x.tables[table]&&x.tables[table][act];return LV_VALID(tv)?tv:x[act]}
const canIntegrations=()=>isAdmin()||!!normPerms(S.profile&&S.profile.perms).integrations;
const canReadTeam=()=>!isAdmin()&&normPerms(S.profile&&S.profile.perms).read_users.length>0;
const canExport=()=>isAdmin()||normPerms(S.profile&&S.profile.perms).export;
const canImport=()=>isAdmin()||normPerms(S.profile&&S.profile.perms).import;
const canSeed=()=>ORDER.filter(t=>t!=='api_connections').every(t=>canDo(t,'create')==='allow');
const canWipe=()=>ORDER.filter(t=>t!=='api_connections').every(t=>canDo(t,'delete')==='allow');
const verbOf=a=>({create:'add',edit:'change',delete:'delete'})[a];
function accessSummary(prof){
  const x=normPerms((prof||S.profile).perms),L=a=>({allow:'allowed',ask:'needs admin approval',deny:'not allowed'})[x[a]];
  const lines=[`Add records: ${L('create')}`,`Change records: ${L('edit')}`,`Delete records: ${L('delete')}`];
  const over=Object.keys(x.tables).length;if(over)lines.push(`${over} module${over>1?'s':''} with their own rule`);
  lines.push(x.read_users.length?(x.read_users.includes('*')?'Can read everyone’s data (read-only)':`Can read the data of ${x.read_users.length} selected user${x.read_users.length>1?'s':''} (read-only)`):'Cannot read other users’ data');
  lines.push(`AI drafts (OpenAI): ${x.ai?'yes':'no'}`);
  lines.push(`Export backup: ${x.export?'yes':'no'} · Import backup: ${x.import?'yes':'no'} · Integrations and API settings: ${x.integrations?'yes':'no'}`);
  return lines}

/* ---------- which screens a person may open ---------- */
function subAllowed(p,s){
  if(isAdmin())return !((p==='settings'&&s==='requests')||(p==='performance'&&s==='team'));
  const k=p+'/'+s;
  if(k==='settings/connection'||k==='settings/feeds'||k==='board/status')return false;
  if(p==='integrations'||k==='settings/calendars')return canIntegrations();
  if(k==='performance/team')return canReadTeam();
  return true}
function accessSubs(n){return n.subs.filter(s=>subAllowed(n.id,s[0]))}

/* ---------- guarding every write ---------- */
function accessErr(msg,extra){const e=new Error(msg);Object.assign(e,extra||{});return e}
const deniedErr=(m,a)=>accessErr(`Your account is not allowed to ${verbOf(a)} ${m.many.toLowerCase()}. Ask an admin if you need this.`,{accessDenied:true});
async function submitChange(m,act,id,d,old){
  let payload={},summary;
  if(act==='create'){Object.keys(d).forEach(k=>{if(!['id','owner','created_at','updated_at'].includes(k)&&d[k]!==undefined)payload[k]=d[k]});summary=`Add ${m.one.toLowerCase()}: ${trunc(labelOf(m.t,Object.assign({id:'new'},d)),60)}`}
  else if(act==='edit'){const nz=v=>v===undefined||v===''?null:v,blank=v=>v===undefined||v===null||v===''||v===false||v===0;Object.keys(d).forEach(k=>{if(['id','owner','created_at','updated_at'].includes(k))return;if(old[k]===undefined&&(blank(d[k])||(()=>{const f=m.fields.find(x=>x.k===k);return f&&f.def!==undefined&&String(f.def)===String(d[k])})()))return;if(JSON.stringify(nz(d[k]))!==JSON.stringify(nz(old[k])))payload[k]=nz(d[k])});
    const names=Object.keys(payload).map(k=>{const f=m.fields.find(x=>x.k===k);return f?f.l:k});summary=`Change ${m.one.toLowerCase()} “${trunc(labelOf(m.t,old),50)}”: ${names.slice(0,5).join(', ')||'details'}`}
  else summary=`Delete ${m.one.toLowerCase()} “${trunc(labelOf(m.t,old),50)}”`;
  if(act==='edit'&&!Object.keys(payload).length)return {summary:'',empty:true};
  const r=await DB.requestChange({tbl:m.t,row_id:id||null,action:act,payload,summary});
  S.reqDirty=true;return {summary,dup:r&&r.dup}}
const pendingErr=(r)=>accessErr(r.empty?'Nothing changed.':(r.dup?'Already waiting for approval: ':'Sent to the admin for approval: ')+r.summary,{pending:true});
/* gate used by saveRow / patchRow / removeRow.  returns 'go' to continue, 'skip' for silent system writes that are not allowed */
async function accessGate(m,act,id,d,old,opts,beforeFn){
  const lv=canDo(m.t,act);
  if(lv==='allow')return 'go';
  if(opts&&opts.sys)return 'skip';
  if(lv==='deny')throw deniedErr(m,act);
  if(beforeFn)beforeFn();
  const r=await submitChange(m,act,id,d,old);throw pendingErr(r)}
window.addEventListener('unhandledrejection',ev=>{const r=ev.reason;if(r&&(r.pending||r.accessDenied)){ev.preventDefault();toast(r.message,r.pending?0:1);try{render()}catch(e){}}});

/* ---------- demo-mode store: settings, requests, accounts ---------- */
Local.settings=function(){const c=this.c();c.settings=Object.assign({signup:'open',default_preset:'standard'},c.settings||{});return c.settings};
Local.requests=function(){const c=this.c();return c.requests=c.requests||[]};
Local.activeAdmins=function(except){return this.c().users.filter(u=>u.role==='admin'&&profStatus(u)==='active'&&u.id!==except).length};
Local.applyRequest=function(r){
  const c=this.c(),rows=c.rows[r.tbl]=c.rows[r.tbl]||[];
  if(r.tbl==='master_data')throw new Error('Not allowed for master data');
  if(r.action==='delete'){const x=rows.find(z=>z.id===r.row_id&&z.owner===r.requester);if(!x)throw new Error('The record no longer exists');this.audit(r.tbl,x.id,'DELETE',clone(x),null);c.rows[r.tbl]=rows.filter(z=>z!==x);cascade(c.rows,r.tbl,x.id)}
  else if(r.action==='edit'){const x=rows.find(z=>z.id===r.row_id&&z.owner===r.requester);if(!x)throw new Error('The record no longer exists');const old=clone(x);Object.keys(r.payload||{}).forEach(k=>{if(!['id','owner','created_at','updated_at'].includes(k))x[k]=r.payload[k]});x.updated_at=nowISO();this.audit(r.tbl,x.id,'UPDATE',old,x)}
  else{const x=Object.assign({},r.payload,{id:(r.payload&&r.payload.id)||uid(),owner:r.requester,created_at:nowISO(),updated_at:nowISO()});rows.push(x);r.row_id=x.id;this.audit(r.tbl,x.id,'INSERT',null,x)}};
Local.adminLog=function(action,target,detail){const c=this.c();(c.audit=c.audit||[]).push({id:uid(),user_id:DB.user.id,user_name:DB.user.full_name||DB.user.email,table_name:'access',record_id:target||null,action,old_data:null,new_data:detail||null,created_at:nowISO()})};
const _mkUser=Local.mkUser;
Local.mkUser=function(o){return Object.assign(_mkUser.call(this,o),{status:'active',perms:{}},o)};

/* ---------- database layer: requests and admin operations (demo + Supabase) ---------- */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
Object.assign(DB,{
  async publicSignupMode(){
    if(this.mode==='demo')return Local.settings().signup;
    try{const {data}=await this.sb.from('app_public').select('signup').maybeSingle();return (data&&data.signup)||'open'}catch(e){return 'open'}},
  async accessSettings(){
    if(this.mode==='demo')return Object.assign({},Local.settings());
    const {data}=await this.sb.from('app_settings').select('value').eq('key','access').maybeSingle();
    return Object.assign({signup:'open',default_preset:'standard'},(data&&data.value)||{})},
  async setAccessSettings(mode,preset){
    if(this.mode==='demo'){const s=Local.settings();s.signup=mode;s.default_preset=preset;Local.adminLog('SIGNUP_MODE',null,{signup:mode,default_preset:preset});Local.save();return}
    const {error}=await this.sb.rpc('admin_set_signup',{p_mode:mode,p_preset:preset});if(error)throw error},
  async requestChange(o){
    if(this.mode==='demo'){
      const list=Local.requests(),me=this.user.id;
      if(o.action==='delete'){const ex=list.find(r=>r.requester===me&&r.status==='pending'&&r.action==='delete'&&r.row_id===o.row_id);if(ex)return {dup:true,id:ex.id}}
      if(o.action==='edit'){const ex=list.find(r=>r.requester===me&&r.status==='pending'&&r.action==='edit'&&r.row_id===o.row_id);if(ex){ex.payload=Object.assign({},ex.payload,o.payload);ex.summary=o.summary;ex.rev=(ex.rev||1)+1;Local.save();return {merged:true,id:ex.id}}}
      let old=null;if(o.action!=='create'){const x=((Local.c().rows[o.tbl])||[]).find(z=>z.id===o.row_id&&z.owner===me);if(!x)throw new Error('You can only ask about your own records');old=clone(x);delete old.auth_value}
      const r={id:uid(),requester:me,tbl:o.tbl,row_id:o.row_id||null,action:o.action,payload:o.payload||{},old_data:old,summary:o.summary||'',status:'pending',note:null,decided_by:null,decided_at:null,created_at:nowISO(),rev:1};
      list.push(r);Local.save();return {id:r.id}}
    const me=this.user.id;
    if(o.action!=='create'){
      const {data:ex}=await this.sb.from('change_requests').select('id,payload,rev').eq('requester',me).eq('row_id',o.row_id).eq('action',o.action).eq('status','pending').limit(1);
      if(ex&&ex.length){if(o.action==='delete')return {dup:true,id:ex[0].id};
        const {error}=await this.sb.from('change_requests').update({payload:Object.assign({},ex[0].payload,o.payload),summary:o.summary}).eq('id',ex[0].id);if(error)throw error;return {merged:true,id:ex[0].id}}}
    const {data,error}=await this.sb.from('change_requests').insert({requester:me,tbl:o.tbl,row_id:o.row_id||null,action:o.action,payload:o.payload||{},summary:o.summary||''}).select('id').single();
    if(error)throw new Error(/row-level security/i.test(error.message)?'The database did not accept this request. Ask an admin to check your permissions.':error.message);return {id:data.id}},
  async requests(){
    if(this.mode==='demo'){const me=this.user.id,admin=S.profile.role==='admin';return Local.requests().filter(r=>admin||r.requester===me).map(clone).sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)))}
    const {data,error}=await this.sb.from('change_requests').select('*').order('created_at',{ascending:false}).limit(300);if(error)throw error;return data||[]},
  async decideRequest(id,approve,note,rev){
    if(this.mode==='demo'){
      const r=Local.requests().find(x=>x.id===id);if(!r)throw new Error('Request not found');
      if(r.status!=='pending')throw new Error('This request was already '+r.status);
      if(rev!=null&&(r.rev||1)!==rev)throw new Error('This request changed after you opened it. Review it again.');
      if(approve)Local.applyRequest(r);
      r.status=approve?'approved':'rejected';r.note=approve?null:(note||null);r.decided_by=this.user.id;r.decided_at=nowISO();
      Local.adminLog(approve?'APPROVE':'REJECT',r.requester,{request:r.id,table:r.tbl,action:r.action});Local.save();return}
    const {error}=approve?await this.sb.rpc('approve_change',{p_id:id,p_rev:rev==null?null:rev}):await this.sb.rpc('reject_change',{p_id:id,p_note:note||null});if(error)throw error},
  async cancelRequest(id){
    if(this.mode==='demo'){const r=Local.requests().find(x=>x.id===id&&x.requester===this.user.id&&x.status==='pending');if(!r)throw new Error('Request not found');r.status='cancelled';Local.save();return}
    const {error}=await this.sb.from('change_requests').update({status:'cancelled'}).eq('id',id);if(error)throw error},
  async adminSetStatus(uid,status){
    if(this.mode==='demo'){const u=Local.c().users.find(x=>x.id===uid);if(!u)throw new Error('User not found');
      if(uid===this.user.id&&status!=='active')throw new Error('You cannot switch off your own account');
      if(u.role==='admin'&&status!=='active'&&Local.activeAdmins(uid)===0)throw new Error('There must always be one active admin');
      u.status=status;u.active=status==='active';Local.adminLog('STATUS',uid,{status});Local.save();return}
    const {error}=await this.sb.rpc('admin_set_status',{p_uid:uid,p_status:status});if(error)throw error},
  async adminSetRole(uid,role){
    if(this.mode==='demo'){const u=Local.c().users.find(x=>x.id===uid);if(!u)throw new Error('User not found');
      if(u.role==='admin'&&role!=='admin'&&(uid===this.user.id||Local.activeAdmins(uid)===0))throw new Error('There must always be one active admin');

const modOfTable=t=>Object.keys(MOD).map(k=>MOD[k]).find(m=>m.t===t);
['insert','insertMany','update','remove','removeMany'].forEach(fn=>{
  const orig=DB[fn];if(typeof orig!=='function')return;
  const act=fn.indexOf('insert')===0?'create':fn==='update'?'edit':'delete';
  DB[fn]=function(t,...a){
    if(this.mode==='demo'&&S.profile&&canDo(t,act)!=='allow'){const m=modOfTable(t)||{many:t};throw accessErr(`Your account is not allowed to ${verbOf(act)} ${String(m.many).toLowerCase()}. Ask an admin if you need this.`,{accessDenied:true})}
    if(this.mode==='demo'&&S.profile&&S.profile.role!=='admin'&&(fn==='update'||fn==='remove'||fn==='removeMany')){
      const rows=Local.c().rows[t]||[],ids=fn==='removeMany'?(a[0]||[]):[a[0]];
      if(ids.some(id=>{const r=rows.find(x=>x.id===id);return r&&r.owner!==this.user.id}))throw accessErr('That record belongs to someone else.',{accessDenied:true})}
    return orig.call(this,t,...a)}});

async function aiInvoke(ai){
  let r;try{r=await DB.sb.functions.invoke('api-proxy',{body:{ai}})}catch(e){r={error:e}}
  const {data,error}=r;
  if(error){
    const nm=error.name||'',st=error.context&&error.context.status;let msg='';
    try{if(error.context&&error.context.json){const j=await error.context.json();msg=(j&&(j.error||j.message))||''}}catch(e){}
    if(nm==='FunctionsFetchError'||nm==='FunctionsRelayError'||st===404)throw accessErr(isAdmin()?'AI is not available: the Edge Function “api-proxy” cannot be reached. Open Settings → Data feeds → Check the Edge Function.':'AI is not available right now. Please tell your admin.',{aiCode:'unreachable'});
    if(st===401||st===403)throw accessErr('Your sign-in was not accepted. Sign out and in again.',{aiCode:'auth'});
    if(st===500&&/Invalid URL/i.test(msg))throw accessErr(isAdmin()?'The deployed api-proxy is an older version without AI. Deploy the latest api-proxy file (see Settings → Data feeds).':'AI is not available yet. Please tell your admin.',{aiCode:'old'});
    throw accessErr(msg||'AI could not be reached.',{aiCode:'http'})}
  if(!data||data.ok===false)throw accessErr((data&&data.message)||'AI did not answer.',{aiCode:(data&&data.code)||'unknown'});
  return data}

  const sl=workSlots(),c=workCfg(),pk=peakHours().filter(h=>h.n>=2).sort((a,b)=>b.avg-a.avg).slice(0,3).map(h=>h.h).sort((a,b)=>a-b);

    peak_hours:pk,activities,carry_over,planned,fixed};
  return {input,refMap,stats:{acts:activities.length,hidden:hidden.length,carry:carry_over.length,planned:planned.length,fixed:fixed.length,titles,focus:focusId()==='all'?'All life areas':focusName(),excl:(st&&st.exclude_areas)||[]}}}

ACT.aiapply=async el=>{
  const dr=S.aiDraft;if(!dr)return;el.disabled=true;
  const day=dr.day,A=D().daily_actions||[],existingTop=A.filter(x=>x.action_date===day&&x.is_top3).length;
  const topSel=dr.items.top3.filter(t=>t.check),topRefs=new Set(topSel.map(t=>t.ref));let topBudget=Math.max(0,3-existingTop),topUsed=0,created=0,starred=0,pending=0,failed=0,skippedTop=0,already=0;
  const actOf=m=>m&&m.kind==='activity'?byId('activities',m.id):m&&m.kind==='carry'&&m.activity_id?byId('activities',m.activity_id):null;
  const mk=(ref,title,start,end,top)=>{const m=ref?dr.refMap[ref]:null,a=actOf(m),port=a&&byId('portfolios',a.portfolio_id),pr=(a&&OPT.priority.includes(a.priority)?a.priority:m&&OPT.priority.includes(m.priority)?m.priority:'Medium');
    return {action_date:day,title:trunc(title||(m&&m.name)||'Work block',160),activity_id:a?a.id:null,time_cat:port&&AI_TC[port.name]||'Work',priority:pr,start_time:start||null,end_time:end||null,planned_min:start&&end?mins(end)-mins(start):(m&&m.min)||null,status:'Not Started',progress:0,is_top3:!!top,pomodoros:0}};
  const doSave=async d=>{try{await saveRow('daily_actions',d);created++}catch(e){if(e&&e.pending)pending++;else{failed++;console.warn(e)}}};
  const wantTop=ref=>{if(!ref||!topRefs.has(ref))return false;if(topUsed>=topBudget){skippedTop++;return false}topUsed++;return true};
  const doneRefs=new Set();
  for(const s of dr.items.schedule.filter(x=>x.check)){const top=wantTop(s.ref);if(s.ref)doneRefs.add(s.ref);await doSave(mk(s.ref,s.title,s.start,s.end,top))}
  for(const t of topSel){if(doneRefs.has(t.ref))continue;
    const m=dr.refMap[t.ref],a=actOf(m),ex=a&&A.find(x=>x.action_date===day&&x.activity_id===a.id&&!['Completed','Cancelled'].includes(x.status));

    const top=wantTop(t.ref);await doSave(mk(t.ref,m&&m.name,null,null,top))}
  closeModal(true);S.ui.day=day;
